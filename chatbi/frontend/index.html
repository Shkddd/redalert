<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBI — 用自然语言问数据</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1>ChatBI</h1>
                <p class="subtitle">自然语言 · 数据查询</p>
            </div>
            <div id="suggestions-container">
                <h3>试试这些查询</h3>
                <div id="suggestions"></div>
            </div>
            <div id="upload-container">
                <h3>上传数据</h3>
                <input type="file" id="file-input" accept=".xlsx" hidden>
                <button id="upload-btn">+ 上传 Excel 文件</button>
                <div id="upload-list"></div>
            </div>
            <div class="sidebar-footer">
                <div id="status">
                    <span class="dot" id="status-dot"></span>
                    <span id="status-text">连接中...</span>
                </div>
                <button id="new-chat-btn" title="新对话">✚ 新对话</button>
            </div>
        </aside>

        <!-- Main -->
        <main>
            <!-- Chat area -->
            <div id="chat-container">
                <div id="messages"></div>
                <div id="welcome">
                    <h2>👋 用自然语言问数据</h2>
                    <p>例如：<em>"上个月总销售额多少？"</em> 或 <em>"华东地区卖得最好的产品"</em></p>
                    <p class="hint">支持趋势分析、对比、排名、分类统计</p>
                </div>
            </div>

            <!-- Input area -->
            <div id="input-area">
                <div id="sql-display" class="hidden">
                    <span class="sql-label">SQL</span>
                    <code id="sql-text"></code>
                    <button id="copy-sql" title="复制SQL">📋</button>
                </div>
                <div id="input-row">
                    <textarea id="query-input" rows="1" placeholder="输入你的数据问题..." 
                              autofocus></textarea>
                    <button id="send-btn" disabled>发送</button>
                </div>
            </div>
        </main>

        <!-- Results panel (slide-in overlay) -->
        <div id="panel-overlay" class="hidden">
            <div id="panel-backdrop"></div>
            <aside id="results-panel">
            <div class="panel-header">
                <h3>📈 查询结果</h3>
                <button id="close-panel">✕</button>
            </div>
            <div id="panel-body">
                <div id="chart-container" class="hidden">
                    <canvas id="chart-canvas"></canvas>
                </div>
                <div id="table-container" class="hidden">
                    <table id="result-table">
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
                <div id="result-meta"></div>
            </div>
        </aside>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
