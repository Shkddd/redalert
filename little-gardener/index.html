function drawOrders(){
  if(!STATE.started || STATE.shopOpen || STATE.toolPanelOpen) return;  // Round 5：toolPanel 打开时让位
  const b = SCENE.orderBox;
  if(!b) return;
  const ox = b.x, oy = b.y, ow = b.w, oh = b.h;
  // 背景
  X.fillStyle = 'rgba(255,250,235,0.88)';
  roundRect(ox, oy, ow, oh, 12);
  X.fill();
  X.strokeStyle = '#a07040';
  X.lineWidth = 2;
  roundRect(ox, oy, ow, oh, 12);
  X.stroke();
  // 标题
  X.fillStyle = '#7a4a20';
  X.font = 'bold 12px sans-serif';
  X.textAlign = 'left';
  X.textBaseline = 'top';
  X.fillText('📋 今日订单', ox + 8, oy + 6);
  // 声望
  X.fillStyle = '#a07020';
  X.font = 'bold 11px sans-serif';
  X.textAlign = 'right';
  X.textBaseline = 'top';
  X.fillText(`⭐ ${STATE.reputation}`, ox + ow - 8, oy + 6);
  X.textBaseline = 'middle';
  // 3 单
  for(let i=0;i<STATE.orders.length;i++){
    const o = STATE.orders[i];
    const rowY = oy + 26 + i * 28;
    if(o.done){
      X.globalAlpha = 0.4;
    }
    // NPC 头像（圆形）
    X.fillStyle = o.npc.color;
    X.beginPath();
    X.arc(ox + 16, rowY + 10, 10, 0, TAU);
    X.fill();
    X.font = '13px sans-serif';
    X.textAlign = 'center';
    X.textBaseline = 'middle';
    X.fillText(o.npc.emoji, ox + 16, rowY + 10);
    // Round 2：好感心 ❤️（>=3 显示在 NPC 头像旁）
    const fav = STATE.npcFav[o.npc.id] || 0;
    if(fav >= 3){
      X.font = '11px sans-serif';
      X.textAlign = 'left';
      X.fillText('❤️', ox + 26, rowY + 4);
    }
    // 想要的花
    X.fillStyle = '#3a2010';
    X.font = 'bold 12px sans-serif';
    X.textAlign = 'left';
    X.textBaseline = 'top';
    X.fillText(`想要 ${o.wantName}`, ox + 32, rowY + 2);
    // 倒计时
    const t = Math.max(0, o.timeLeft | 0);
    X.fillStyle = o.done ? (o.failed ? '#a85050' : '#5a9050') : (t < 30 ? '#e85050' : '#7a4a20');
    X.font = '11px sans-serif';
    X.fillText(o.done ? (o.failed ? '走了' : '完成') : `${t}s`, ox + 32, rowY + 16);
    // 报酬
    X.fillStyle = '#c89020';
    X.font = 'bold 12px sans-serif';
    X.textAlign = 'right';
    X.textBaseline = 'middle';
    X.fillText(`+${o.pay}💰`, ox + ow - 50, rowY + 10);
    // 提交按钮
    const btnX = ox + ow - 44, btnY = rowY, btnW = 36, btnH = 22;
    if(!o.done){
      X.fillStyle = '#7bc050';
      roundRect(btnX, btnY, btnW, btnH, 6);
      X.fill();
      X.strokeStyle = '#4a8030'; X.lineWidth = 1.5;
      roundRect(btnX, btnY, btnW, btnH, 6);
      X.stroke();
      X.fillStyle = '#fff';
      X.font = 'bold 11px sans-serif';
      X.textAlign = 'center';
      X.textBaseline = 'middle';
      X.fillText('卖', btnX + btnW/2, btnY + btnH/2);
      o._sellBox = { x:btnX, y:btnY, w:btnW, h:btnH };
    } else {
      o._sellBox = null;
    }
    X.globalAlpha = 1;
  }
  X.textAlign = 'left';
  X.textBaseline = 'middle';
}

function drawSeedBag(){
  const b = SCENE.bagBox;
  // 背景
  X.fillStyle = 'rgba(255,250,235,0.85)';
  roundRect(b.x, b.y, b.w, b.h, 12);
  X.fill();
  X.strokeStyle = '#a07040';
  X.lineWidth = 2;
  roundRect(b.x, b.y, b.w, b.h, 12);
  X.stroke();
  // 标题
  X.fillStyle = '#7a4a20';
  X.font = 'bold 11px sans-serif';
  X.textBaseline = 'top';
  X.textAlign = 'left';
  X.fillText('🌰 种子袋', b.x + 8, b.y + 4);
  // 库存总数（右上）
  const totalSeeds = Object.values(STATE.seeds).reduce((a, c) => a + (c || 0), 0);
  X.fillStyle = '#a07020';
  X.font = 'bold 10px sans-serif';
  X.textAlign = 'right';
  X.fillText(`📦 ${totalSeeds}`, b.x + b.w - 28, b.y + 5);
  // "+" 按钮（最右上，圆形小按钮 → 打开商店）
  const plusBtnX = b.x + b.w - 12, plusBtnY = b.y + 12;
  X.fillStyle = 'rgba(150,200,255,0.75)';
  X.beginPath();
  X.arc(plusBtnX, plusBtnY, 10, 0, TAU);
  X.fill();
  X.strokeStyle = '#3a6a90'; X.lineWidth = 1.5;
  X.stroke();
  X.fillStyle = '#1a3a5a';
  X.font = 'bold 14px sans-serif';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText('+', plusBtnX, plusBtnY + 1);
  SCENE.bagPlus = { x: plusBtnX-12, y: plusBtnY-12, w:24, h:24 };
  X.textAlign = 'left';

  // === Round 3：解锁进度（彩虹条）===
  const unlockedCount = SEEDS.filter(s => STATE.unlocked[s.id]).length;
  const total = SEEDS.length;
  const ratio = total ? unlockedCount / total : 0;
  const progX = b.x + 8, progY = b.y + 20, progW = b.w - 16, progH = 10;
  X.fillStyle = 'rgba(0,0,0,0.08)';
  roundRect(progX, progY, progW, progH, 5);
  X.fill();
  if(ratio > 0){
    const grd = X.createLinearGradient(progX, 0, progX + progW, 0);
    const cols = ['#ff8080','#ffaa50','#ffe040','#80e050','#50d0c0','#6080e0','#a060d0','#e060a0','#ffd040','#80c060'];
    cols.forEach((c, i) => grd.addColorStop(i / (cols.length - 1), c));
    X.fillStyle = grd;
    roundRect(progX, progY, progW * ratio, progH, 5);
    X.fill();
  }
  X.fillStyle = ratio >= 1 ? '#c03020' : '#3a2010';
  X.font = 'bold 9px sans-serif';
  X.textAlign = 'center';
  X.textBaseline = 'middle';
  X.fillText(ratio >= 1 ? '🎉 已集齐所有种子！' : `🌱 已解锁 ${unlockedCount}/${total}`, progX + progW/2, progY + progH/2);
  X.textAlign = 'left';

  // === Round 3：种子网格 2 行 × 5 列（全部 10 种都显示）===
  const cols = 5;
  const cellW = (b.w - 20) / cols;
  const cellH = 22;
  const startX = b.x + 10;
  const startY = b.y + 38;
  for(let i=0; i<SEEDS.length; i++){
    const def = SEEDS[i];
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = startX + col * cellW + cellW/2;
    const cy = startY + row * cellH + cellH/2;
    const cnt = STATE.seeds[def.id] || 0;
    const unlocked = STATE.unlocked[def.id];
    const isSelected = STATE.selectedSeed === def.id && unlocked && cnt > 0;

    // 选中高亮
    if(isSelected){
      X.fillStyle = 'rgba(255,220,120,0.55)';
      X.beginPath();
      X.arc(cx, cy, 13, 0, TAU);
      X.fill();
    }

    if(!unlocked){
      // === 未解锁：灰色 + ❓ ===
      X.globalAlpha = 0.55;
      X.fillStyle = '#888';
      X.beginPath();
      X.ellipse(cx - 4, cy, 8, 5, 0, 0, TAU);
      X.fill();
      X.strokeStyle = 'rgba(0,0,0,0.4)';
      X.lineWidth = 1;
      X.stroke();
      X.globalAlpha = 1;
      // ❓ 徽章
      X.fillStyle = '#fff';
      X.strokeStyle = '#666';
      X.lineWidth = 1.5;
      X.beginPath();
      X.arc(cx + 8, cy - 7, 6, 0, TAU);
      X.fill();
      X.stroke();
      X.fillStyle = '#555';
      X.font = 'bold 9px sans-serif';
      X.textAlign = 'center';
      X.textBaseline = 'middle';
      X.fillText('?', cx + 8, cy - 7);
    } else {
      // === 已解锁 ===
      const isEmpty = cnt <= 0;
      X.globalAlpha = isEmpty ? 0.5 : 1;
      X.fillStyle = def.seedColor;
      X.beginPath();
      X.ellipse(cx - 4, cy, 9, 6, 0, 0, TAU);
      X.fill();
      X.strokeStyle = 'rgba(0,0,0,0.4)';
      X.lineWidth = 1.2;
      X.stroke();
      // Round 6：季节标记 — 当季花的小 emoji（左侧）
      if(seasonCanBloom(def)){
        X.font = '10px sans-serif';
        X.textAlign = 'center';
        X.textBaseline = 'middle';
        X.fillText(currentSeason().emoji, cx - 14, cy - 7);
      }
      // 数量徽章
      X.fillStyle = '#fff';
      X.strokeStyle = '#7a4a20';
      X.lineWidth = 1.2;
      X.beginPath();
      X.arc(cx + 9, cy - 8, 6, 0, TAU);
      X.fill();
      X.stroke();
      X.fillStyle = isEmpty ? '#888' : '#7a4a20';
      X.font = 'bold 8px sans-serif';
      X.textAlign = 'center';
      X.textBaseline = 'middle';
      X.fillText(String(cnt), cx + 9, cy - 8);
      X.globalAlpha = 1;
    }
    // 名字
    X.fillStyle = unlocked ? '#3a2010' : '#777';
    X.font = '8px sans-serif';
    X.textAlign = 'center';
    X.textBaseline = 'top';
    X.fillText(def.name, cx, cy + 8);
    // 触摸区域（点击命中用）
    def._bagBox = { x: cx - cellW/2 + 2, y: cy - cellH/2, w: cellW - 4, h: cellH };
  }
  X.textAlign = 'left';
  X.textBaseline = 'middle';
}

/* ============================================================
 *  Round 5：工具按钮（圆形 40px，左侧）
 *  显示当前等级图标 + 数字徽章 + 面板打开高亮
 * ============================================================ */
function drawToolButton(){
  const b = SCENE.toolBox;
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  const tool = STATE.tool || 1;
  const lv = TOOL_LEVELS[tool - 1];
  // 圆形背景（面板打开时变金色高亮）
  X.fillStyle = STATE.toolPanelOpen ? 'rgba(255,220,120,0.95)' : 'rgba(255,250,235,0.85)';
  X.beginPath(); X.arc(cx, cy, 20, 0, TAU); X.fill();
  X.strokeStyle = lv.color; X.lineWidth = 3;
  X.stroke();
  // 等级 emoji
  X.font = '22px sans-serif';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(lv.emoji, cx, cy + 1);
  // 数字徽章（右上角）
  X.fillStyle = lv.color;
  X.beginPath(); X.arc(b.x + b.w - 2, b.y + 6, 8, 0, TAU); X.fill();
  X.fillStyle = '#fff';
  X.font = 'bold 10px sans-serif';
  X.fillText(String(tool), b.x + b.w - 2, b.y + 6);
  X.textAlign = 'left';
}

/* ============================================================
 *  Round 5：工具升级面板（种子袋下方，与订单面板互斥）
 *  3 张等级卡：当前等级高亮 + 价格 + 升级按钮
 * ============================================================ */
function drawToolPanel(){
  if(!STATE.toolPanelOpen) return;
  const b = SCENE.toolPanel;
  // 背景
  X.fillStyle = 'rgba(255,250,235,0.95)';
  roundRect(b.x, b.y, b.w, b.h, 12); X.fill();
  X.strokeStyle = '#a07040'; X.lineWidth = 2;
  roundRect(b.x, b.y, b.w, b.h, 12); X.stroke();
  // 标题
  X.fillStyle = '#7a4a20';
  X.font = 'bold 12px sans-serif';
  X.textAlign = 'left'; X.textBaseline = 'top';
  X.fillText('🔧 工具升级', b.x + 8, b.y + 4);
  X.fillStyle = '#a07020';
  X.font = '10px sans-serif';
  X.textAlign = 'right';
  X.fillText(`当前 L${STATE.tool || 1}`, b.x + b.w - 8, b.y + 6);
  X.textBaseline = 'middle';

  // 3 张卡（横向）
  const cardH = 76;
  const cardW = (b.w - 32) / 3;
  const startX = b.x + 8;
  const startY = b.y + 26;
  for(let i=0; i<3; i++){
    const lv = i + 1;
    const def = TOOL_LEVELS[i];
    const owned = STATE.toolUpgrades[lv];
    const isCurrent = (STATE.tool || 1) === lv;
    const cardX = startX + i * (cardW + 4);
    const cardY = startY;

    // 卡片底（当前等级高亮）
    X.fillStyle = isCurrent ? 'rgba(255,220,120,0.55)' : 'rgba(255,255,255,0.7)';
    roundRect(cardX, cardY, cardW, cardH, 8); X.fill();
    X.strokeStyle = isCurrent ? def.color : '#c0a070'; X.lineWidth = isCurrent ? 2 : 1;
    roundRect(cardX, cardY, cardW, cardH, 8); X.stroke();

    // emoji
    X.font = '22px sans-serif';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(def.emoji, cardX + cardW/2, cardY + 16);
    // 名字
    X.fillStyle = isCurrent ? def.color : '#5a3a1a';
    X.font = 'bold 11px sans-serif';
    X.textAlign = 'center'; X.textBaseline = 'top';
    X.fillText(def.name, cardX + cardW/2, cardY + 30);
    // 描述
    X.fillStyle = '#5a3a1a';
    X.font = '9px sans-serif';
    X.fillText(def.desc, cardX + cardW/2, cardY + 44);

    // 状态：已拥有 / 价格 + 升级按钮
    if(owned){
      X.fillStyle = isCurrent ? '#5a8a20' : '#7a6020';
      X.font = 'bold 10px sans-serif';
      X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(isCurrent ? '✅ 装备中' : '✓ 已拥有', cardX + cardW/2, cardY + 60);
      def._upgradeBox = null;
    } else {
      const cost = TOOL_UPGRADE_PRICE[lv] || 0;
      const repReq = TOOL_UPGRADE_REP[lv] || 0;
      const canBuy = STATE.coins >= cost && STATE.reputation >= repReq;
      X.fillStyle = canBuy ? '#c89020' : '#888';
      X.font = 'bold 10px sans-serif';
      X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText(`${cost}💰${repReq ? ' +' + repReq + '⭐' : ''}`, cardX + cardW/2, cardY + 58);
      // 升级按钮
      const btnW = 50, btnH = 14;
      const btnX = cardX + (cardW - btnW)/2;
      const btnY = cardY + cardH - btnH - 4;
      X.fillStyle = canBuy ? '#7bc050' : '#bbb';
      roundRect(btnX, btnY, btnW, btnH, 4); X.fill();
      X.fillStyle = canBuy ? '#fff' : '#888';
      X.font = 'bold 10px sans-serif';
      X.textAlign = 'center'; X.textBaseline = 'middle';
      X.fillText('升级', btnX + btnW/2, btnY + btnH/2 + 1);
      def._upgradeBox = { x:btnX, y:btnY, w:btnW, h:btnH };
    }
  }
  X.textAlign = 'left';
}

function drawWateringPot(){
  const b = SCENE.potBox;
  if(!STATE.holdingPot){
    // 静止在盒子里
    X.fillStyle = 'rgba(255,250,235,0.85)';
    roundRect(b.x, b.y, b.w, b.h, 12);
    X.fill();
    X.strokeStyle = '#a07040';
    X.lineWidth = 2;
    roundRect(b.x, b.y, b.w, b.h, 12);
    X.stroke();
    drawPotIcon(b.x + b.w/2, b.y + b.h/2, 0);
    // Round 5：L3 时在壶盒右上角显示免费 toggle 星
    if((STATE.tool || 1) === 3){
      drawStarToggle(b.x + b.w - 14, b.y + 14);
    }
  } else {
    drawPotIcon(STATE.pot.x, STATE.pot.y, STATE.pot.angle);
    // 提示
    X.fillStyle = '#5a3a1a';
    X.font = 'bold 11px sans-serif';
    X.textAlign = 'center';
    X.textBaseline = 'top';
    const tag = (STATE.tool || 1) === 3 ? (STATE.freeWaterNext ? '⭐ 免费全场' : '⭐ 全场喷淋') : '💧点一下';
    X.fillText(tag, STATE.pot.x, STATE.pot.y + 28);
    X.textAlign = 'left';
  }
}

/* Round 5：5 角星通用绘制（粒子/星 toggle 共用） */
function drawStarShape(cx, cy, r1, r2, rot){
  X.beginPath();
  for(let i=0;i<10;i++){
    const a = (i/10)*TAU + rot;
    const r = i%2===0 ? r1 : r2;
    const px = cx + Math.cos(a)*r;
    const py = cy + Math.sin(a)*r;
    i===0 ? X.moveTo(px, py) : X.lineTo(px, py);
  }
  X.closePath();
}

/* Round 5：L3 星形 toggle 按钮（壶盒右上角） */
function drawStarToggle(x, y){
  const on = !!STATE.freeWaterNext;
  // 圆背景
  X.fillStyle = on ? 'rgba(255,210,80,0.95)' : 'rgba(200,200,200,0.7)';
  X.beginPath(); X.arc(x, y, 11, 0, TAU); X.fill();
  X.strokeStyle = on ? '#c87020' : '#888'; X.lineWidth = 1.5;
  X.stroke();
  // 5 角星
  X.fillStyle = on ? '#fff' : '#aaa';
  drawStarShape(x, y, 7, 3.2, -Math.PI/2);
  X.fill();
  // 触摸区域（导出给 click handler）
  SCENE.starToggle = { x: x-13, y: y-13, w: 26, h: 26 };
}

function drawPotIcon(x, y, angle){
  X.save();
  X.translate(x, y);
  X.rotate(angle);
  // 壶身
  X.fillStyle = '#6ab0d8';
  X.strokeStyle = '#3a5878';
  X.lineWidth = 2;
  X.beginPath();
  X.ellipse(0, 0, 16, 14, 0, 0, TAU);
  X.fill(); X.stroke();
  // 提手
  X.strokeStyle = '#3a5878';
  X.lineWidth = 2;
  X.beginPath();
  X.arc(0, -2, 10, Math.PI*1.1, Math.PI*1.9);
  X.stroke();
  // 壶嘴
  X.fillStyle = '#6ab0d8';
  X.beginPath();
  X.moveTo(12, -2);
  X.lineTo(28, -8);
  X.lineTo(28, -2);
  X.lineTo(14, 4);
  X.closePath();
  X.fill(); X.stroke();
  // 高光
  X.fillStyle = 'rgba(255,255,255,0.5)';
  X.beginPath();
  X.ellipse(-5, -4, 4, 3, 0, 0, TAU);
  X.fill();
  X.restore();
}

function drawTimeIndicator(){
  const b = SCENE.timeBox;
  X.fillStyle = 'rgba(255,250,235,0.85)';
  roundRect(b.x, b.y, b.w, b.h, 12);
  X.fill();
  X.strokeStyle = '#a07040';
  X.lineWidth = 2;
  roundRect(b.x, b.y, b.w, b.h, 12);
  X.stroke();
  // 时间圆环
  const cx = b.x + b.w/2, cy = b.y + b.h/2 - 4;
  X.strokeStyle = 'rgba(0,0,0,0.15)';
  X.lineWidth = 3;
  X.beginPath(); X.arc(cx, cy, 14, 0, TAU); X.stroke();
  X.strokeStyle = '#f0a040';
  X.beginPath();
  X.arc(cx, cy, 14, -Math.PI/2, -Math.PI/2 + STATE.dayTime * TAU);
  X.stroke();
  // 太阳/月亮图标
  if(isNight()){
    X.fillStyle = '#fff8d0';
    X.beginPath(); X.arc(cx, cy, 7, 0, TAU); X.fill();
  } else {
    X.fillStyle = '#ffd040';
    X.beginPath(); X.arc(cx, cy, 7, 0, TAU); X.fill();
  }
  X.fillStyle = '#7a4a20';
  X.font = '10px sans-serif';
  X.textAlign = 'center';
  X.fillText('跳时间', cx, b.y + b.h - 12);
  X.textAlign = 'left';
}

function drawFlyingSeeds(){
  for(const s of STATE.flyingSeeds){
    X.save();
    X.translate(s.x, s.y);
    X.rotate(s.t * 2);
    X.fillStyle = '#fff8d0';
    for(let i=0;i<6;i++){
      const a = i/6 * TAU;
      X.beginPath();
      X.moveTo(0, 0);
      X.lineTo(Math.cos(a)*10, Math.sin(a)*10);
      X.strokeStyle = '#c8b870';
      X.lineWidth = 1.2;
      X.stroke();
    }
    X.fillStyle = '#a08040';
    X.beginPath(); X.arc(0,0, 2, 0, TAU); X.fill();
    X.restore();
  }
}

// 地上掉落种子：小光球 + 脉动 + 种子色
function drawGroundSeeds(){
  for(const s of STATE.groundSeeds){
    const def = SEEDS.find(d => d.id === s.defId);
    if(!def) continue;
    X.save();
    X.translate(s.x, s.y);
    const pulse = 1 + Math.sin(s.t * 4) * 0.10;
    X.scale(pulse, pulse);
    // 光晕
    X.fillStyle = 'rgba(255,240,140,0.55)';
    X.beginPath();
    X.arc(0, 0, 10, 0, TAU);
    X.fill();
    // 种子本体
    X.fillStyle = def.seedColor;
    X.beginPath();
    X.ellipse(0, 0, 7, 5, 0, 0, TAU);
    X.fill();
    X.strokeStyle = 'rgba(0,0,0,0.45)';
    X.lineWidth = 1.2;
    X.stroke();
    X.restore();
  }
}

function drawParticles(){
  for(const p of STATE.particles){
    const a = clamp(p.life / p.max, 0, 1);
    if(p.kind === 'drop'){
      X.fillStyle = `rgba(80,160,220,${a})`;
      X.beginPath();
      X.ellipse(p.x, p.y, p.r*a, p.r*1.5*a, 0, 0, TAU);
      X.fill();
    } else if(p.kind === 'star'){
      // Round 5：星星粒子 — 旋转 5 角星
      X.save();
      X.translate(p.x, p.y);
      X.rotate(p.ph || 0);
      X.globalAlpha = a;
      X.fillStyle = p.color;
      drawStarShape(0, 0, p.r*1.4, p.r*0.7, 0);
      X.fill();
      X.globalAlpha = 1;
      X.restore();
    } else if(p.kind === 'firefly'){
      // Round 6：萤火虫 — 中心点 + 软光晕
      const pulse = 0.6 + 0.4 * Math.sin(STATE.time * 4 + p.ph);
      X.save();
      X.globalAlpha = a * pulse;
      X.fillStyle = p.color;
      X.beginPath(); X.arc(p.x, p.y, p.r * 0.7, 0, TAU); X.fill();
      // 软光晕
      const grd = X.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      grd.addColorStop(0, `rgba(255,240,160,${0.5 * pulse})`);
      grd.addColorStop(1, 'rgba(255,240,160,0)');
      X.fillStyle = grd;
      X.beginPath(); X.arc(p.x, p.y, p.r * 4, 0, TAU); X.fill();
      X.globalAlpha = 1;
      X.restore();
    } else if(p.kind === 'leaf'){
      // Round 6：落叶 — 小椭圆旋转
      X.save();
      X.translate(p.x, p.y);
      X.rotate(p.angle || 0);
      X.fillStyle = p.color;
      X.globalAlpha = a;
      X.beginPath();
      X.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, TAU);
      X.fill();
      X.strokeStyle = 'rgba(120,60,20,0.4)';
      X.lineWidth = 1;
      X.beginPath(); X.moveTo(-p.r*0.7, 0); X.lineTo(p.r*0.7, 0); X.stroke();
      X.globalAlpha = 1;
      X.restore();
    } else if(p.kind === 'snow'){
      // Round 6：雪花 — 白色小圆 + 软边
      X.save();
      X.fillStyle = p.color;
      X.globalAlpha = a;
      X.beginPath(); X.arc(p.x, p.y, p.r * 0.9, 0, TAU); X.fill();
      // 软光边
      X.fillStyle = `rgba(220,230,250,${0.5 * a})`;
      X.beginPath(); X.arc(p.x, p.y, p.r * 1.6, 0, TAU); X.fill();
      X.globalAlpha = 1;
      X.restore();
    } else {
      X.fillStyle = p.color;
      X.globalAlpha = a;
      X.beginPath();
      X.arc(p.x + Math.sin(p.ph + STATE.time*2)*2, p.y, p.r, 0, TAU);
      X.fill();
      X.globalAlpha = 1;
    }
  }
}

function drawDragSeed(){
  if(!STATE.dragSeed) return;
  const s = STATE.dragSeed;
  X.save();
  X.globalAlpha = 0.85;
  X.translate(s.x, s.y);
  X.fillStyle = s.def.seedColor;
  X.beginPath();
  X.ellipse(0, 0, 14, 10, 0, 0, TAU);
  X.fill();
  X.strokeStyle = 'rgba(0,0,0,0.4)';
  X.lineWidth = 2;
  X.stroke();
  X.restore();
}

function drawArrow(){
  if(STATE.arrowTimer <= 0) return;
  STATE.arrowTimer -= 1/60;
  const alpha = STATE.arrowTimer / 5;
  X.save();
  X.globalAlpha = alpha;
  const b = SCENE.bagBox;
  X.strokeStyle = '#c85020';
  X.fillStyle = '#c85020';
  X.lineWidth = 4;
  // 弧形箭头指向种子袋
  X.beginPath();
  X.moveTo(b.x + b.w + 80, b.y + b.h + 60);
  X.quadraticCurveTo(b.x + b.w + 60, b.y + b.h, b.x + b.w, b.y + b.h - 5);
  X.stroke();
  // 箭头三角
  X.beginPath();
  X.moveTo(b.x + b.w - 5, b.y + b.h - 15);
  X.lineTo(b.x + b.w, b.y + b.h - 5);
  X.lineTo(b.x + b.w - 12, b.y + b.h - 2);
  X.closePath();
  X.fill();
  // 文字
  X.font = 'bold 16px sans-serif';
  X.fillText('点这里选种子 →', b.x + b.w + 10, b.y + b.h + 50);
  X.restore();
}

function drawCoinHUD(){
  const c = SCENE.coinHud;
  X.fillStyle = 'rgba(255,250,235,0.9)';
  roundRect(c.x, c.y, c.w, c.h, 18);
  X.fill();
  X.strokeStyle = '#c89020'; X.lineWidth = 2;
  X.stroke();
  X.fillStyle = '#7a5010';
  X.font = 'bold 16px sans-serif';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(`💰 ${STATE.coins}`, c.x + c.w/2, c.y + c.h/2);
}

/* ============================================================
 *  Round 6：季节倒计时卡（右上） + 切换 banner（屏幕中上）
 * ============================================================ */
function drawSeasonCard(){
  const b = SCENE.seasonCard;
  const s = currentSeason();
  const d = STATE.dayInSeason || 1;
  // 卡片底
  X.fillStyle = 'rgba(255,250,235,0.92)';
  roundRect(b.x, b.y, b.w, b.h, 12);
  X.fill();
  // 季节主色边框
  X.strokeStyle = s.ground[0];
  X.lineWidth = 2.5;
  roundRect(b.x, b.y, b.w, b.h, 12);
  X.stroke();
  // emoji 大图标
  X.font = '22px sans-serif';
  X.textAlign = 'left'; X.textBaseline = 'middle';
  X.fillText(s.emoji, b.x + 10, b.y + b.h/2 + 1);
  // 文字
  X.fillStyle = '#5a3a1a';
  X.font = 'bold 13px sans-serif';
  X.textAlign = 'left';
  X.fillText(`${s.name}天 第 ${d}/5 天`, b.x + 40, b.y + 12);
  // 进度条
  const barX = b.x + 40, barY = b.y + 24, barW = b.w - 50, barH = 7;
  X.fillStyle = 'rgba(0,0,0,0.08)';
  roundRect(barX, barY, barW, barH, 3);
  X.fill();
  const grd = X.createLinearGradient(barX, 0, barX + barW * (d / 5), 0);
  grd.addColorStop(0, s.skyDay[0]);
  grd.addColorStop(1, s.skyDay[1]);
  X.fillStyle = grd;
  roundRect(barX, barY, barW * (d / 5), barH, 3);
  X.fill();
  X.textAlign = 'left';
}

function updateSeasonBanner(dt){
  if(!STATE.seasonBanner) return;
  STATE.seasonBanner.t += dt;
  // life 秒后清除（让 drawSeasonBanner 自行处理淡出动画）
  if(STATE.seasonBanner.t > STATE.seasonBanner.life + 0.6){
    STATE.seasonBanner = null;
  }
}
function drawSeasonBanner(){
  const b = STATE.seasonBanner;
  if(!b) return;
  const fadeIn = clamp(b.t / 0.4, 0, 1);
  const fadeOut = clamp((b.life - b.t) / 0.6, 0, 1);
  const alpha = Math.min(fadeIn, fadeOut);
  if(alpha <= 0) return;
  const w = 340, h = 90;
  const x = (W - w) / 2;
  const slideY = (1 - fadeIn) * -30;
  const y = 80 + slideY;
  X.save();
  X.globalAlpha = alpha;
  // 阴影
  X.fillStyle = 'rgba(0,0,0,0.18)';
  roundRect(x + 4, y + 5, w, h, 18);
  X.fill();
  // 卡片
  X.fillStyle = 'rgba(255, 250, 235, 0.96)';
  roundRect(x, y, w, h, 18);
  X.fill();
  // 季节色粗描边
  const s = currentSeason();
  X.strokeStyle = s.ground[0];
  X.lineWidth = 4;
  roundRect(x, y, w, h, 18);
  X.stroke();
  // emoji
  X.font = '44px sans-serif';
  X.textAlign = 'left'; X.textBaseline = 'middle';
  X.fillText(b.emoji, x + 24, y + h/2);
  // 标题
  X.fillStyle = '#5a3a1a';
  X.font = 'bold 24px sans-serif';
  X.textAlign = 'left'; X.textBaseline = 'top';
  X.fillText(b.title, x + 92, y + 16);
  // 副标题
  X.fillStyle = '#7a6020';
  X.font = '14px sans-serif';
  X.fillText(b.sub, x + 92, y + 50);
  X.globalAlpha = 1;
  X.restore();
}

function drawShopButton(){
  const b = SCENE.shopBtn;
  X.fillStyle = STATE.shopOpen ? 'rgba(80,150,220,0.95)' : 'rgba(150,200,255,0.9)';
  roundRect(b.x, b.y, b.w, b.h, 16);
  X.fill();
  X.strokeStyle = '#3a6a90'; X.lineWidth = 2;
  X.stroke();
  X.fillStyle = '#fff';
  X.font = 'bold 13px sans-serif';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText('🏪 商店', b.x + b.w/2, b.y + b.h/2);
}

function drawShop(){
  if(!STATE.shopOpen) return;
  X.fillStyle = 'rgba(0,0,0,0.4)';
  X.fillRect(0, 0, W, H);
  // Round 4：商店面板自适应高度
  const unlockedAll = SEEDS.filter(s => STATE.unlocked[s.id]);
  const lockedAll = SEEDS.filter(s => !STATE.unlocked[s.id]);
  const totalRows = unlockedAll.length + lockedAll.length;
  const cardH = 58, cardGap = 6;
  const headerH = 110;
  const listH = totalRows * (cardH + cardGap);
  const cw = 400;
  const ch = Math.min(H - 40, headerH + listH + 20);
  const cx = W/2 - cw/2, cy = H/2 - ch/2;
  X.fillStyle = '#fff8e8';
  roundRect(cx, cy, cw, ch, 16);
  X.fill();
  X.strokeStyle = '#a07040'; X.lineWidth = 3;
  X.stroke();
  X.fillStyle = '#5a3a1a';
  X.font = 'bold 22px sans-serif';
  X.textAlign = 'center'; X.textBaseline = 'top';
  X.fillText('🏪 商店', W/2, cy + 14);
  X.fillStyle = '#7a6020';
  X.font = '12px sans-serif';
  X.fillText(`💰 ${STATE.coins}`, W/2, cy + 42);
  X.fillStyle = '#e85050';
  X.beginPath(); X.arc(cx + cw - 20, cy + 20, 14, 0, TAU); X.fill();
  X.fillStyle = '#fff';
  X.font = 'bold 18px sans-serif';
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText('×', cx + cw - 20, cy + 20);
  SCENE.shopClose = { x:cx+cw-32, y:cy+8, w:24, h:24 };

  // 段头：可购买
  let y = cy + 62;
  X.fillStyle = '#5a8a20';
  X.font = 'bold 12px sans-serif';
  X.textAlign = 'left'; X.textBaseline = 'middle';
  X.fillText('🛒 可购买种子', cx + 20, y);
  X.fillStyle = '#a07020';
  X.font = '10px sans-serif';
  X.textAlign = 'right';
  X.fillText(`${unlockedAll.length} 种已解锁`, cx + cw - 20, y);
  y += 18;

  // 已解锁的种子卡
  for(const def of unlockedAll){
    const cardX = cx + 20, cardY = y, cardW = cw - 40, cardH2 = cardH;
    const cnt = STATE.seeds[def.id] || 0;
    X.fillStyle = '#fff';
    roundRect(cardX, cardY, cardW, cardH2, 10);
    X.fill();
    X.strokeStyle = '#c0a070'; X.lineWidth = 1.5;
    X.stroke();
    // 种子椭圆
    X.fillStyle = def.seedColor;
    X.beginPath();
    X.ellipse(cardX + 26, cardY + cardH2/2, 12, 8, 0, 0, TAU);
    X.fill();
    X.strokeStyle = 'rgba(0,0,0,0.25)'; X.lineWidth = 1;
    X.stroke();
    // emoji
    X.font = '16px sans-serif';
    X.textAlign = 'left'; X.textBaseline = 'middle';
    X.fillText(SEED_EMOJI[def.id] || '🌱', cardX + 46, cardY + 22);
    // 名字
    X.fillStyle = '#3a2010';
    X.font = 'bold 13px sans-serif';
    X.fillText(def.name, cardX + 70, cardY + 22);
    // Round 6：当季花的小标记 — emoji 显示在名字右侧
    if(seasonCanBloom(def)){
      X.font = '14px sans-serif';
      X.fillText(currentSeason().emoji, cardX + 130, cardY + 22);
    }
    // 库存 + 卖价
    X.fillStyle = cnt > 0 ? '#5a8a20' : '#a07020';
    X.font = '11px sans-serif';
    X.fillText(`库存 ${cnt}  ·  卖价 ${def.sellPrice}💰`, cardX + 70, cardY + 40);
    // 买按钮
    const btnX = cardX + cardW - 76, btnY = cardY + 12, btnW = 64, btnH = cardH2 - 24;
    const price = def.buyPrice || 8;
    const canBuy = STATE.coins >= price;
    X.fillStyle = canBuy ? '#7bc050' : '#aaa';
    roundRect(btnX, btnY, btnW, btnH, 8);
    X.fill();
    X.fillStyle = '#fff';
    X.font = 'bold 12px sans-serif';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(`${price} 💰`, btnX + btnW/2, btnY + btnH/2 - 6);
    X.font = '10px sans-serif';
    X.fillText('买 1 颗', btnX + btnW/2, btnY + btnH/2 + 8);
    def._buyBox = { x:btnX, y:btnY, w:btnW, h:btnH };
    y += cardH2 + cardGap;
  }

  // 段头：未解锁（锁住）
  if(lockedAll.length){
    X.fillStyle = '#a07040';
    X.font = 'bold 12px sans-serif';
    X.textAlign = 'left'; X.textBaseline = 'middle';
    X.fillText('🔒 未解锁（达成条件解锁）', cx + 20, y + 4);
    y += 18;
    for(const def of lockedAll){
      const cardX = cx + 20, cardY = y, cardW = cw - 40, cardH2 = 40;
      X.fillStyle = 'rgba(220,210,190,0.6)';
      roundRect(cardX, cardY, cardW, cardH2, 10);
      X.fill();
      X.strokeStyle = '#c0a070'; X.lineWidth = 1;
      X.setLineDash([4, 3]);
      X.stroke();
      X.setLineDash([]);
      X.fillStyle = '#888';
      X.beginPath();
      X.ellipse(cardX + 22, cardY + cardH2/2, 10, 6, 0, 0, TAU);
      X.fill();
      X.fillStyle = '#3a2010';
      X.font = 'bold 12px sans-serif';
      X.textAlign = 'left'; X.textBaseline = 'middle';
      X.fillText(`❓ ${def.name}`, cardX + 42, cardY + 13);
      X.fillStyle = '#a07020';
      X.font = '10px sans-serif';
      X.fillText(LOCK_STORIES[def.id] || '神秘种子…', cardX + 42, cardY + 30);
      y += cardH2 + cardGap;
    }
  }

  X.textAlign = 'left';
  X.textBaseline = 'middle';
}

function roundRect(x,y,w,h,r){
  X.beginPath();
  X.moveTo(x+r, y);
  X.lineTo(x+w-r, y); X.quadraticCurveTo(x+w, y, x+w, y+r);
  X.lineTo(x+w, y+h-r); X.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  X.lineTo(x+r, y+h); X.quadraticCurveTo(x, y+h, x, y+h-r);
  X.lineTo(x, y+r); X.quadraticCurveTo(x, y, x+r, y);
}

/* ============================================================
 *  主循环
 * ============================================================ */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  STATE.time += dt;
  if(STATE.started){
    updateDay(dt);
    updateOrders(dt);
    updatePot(dt);
    updatePlants(dt);
    updateButterflies(dt);
    updateFlyingSeeds(dt);
    updateGroundSeeds(dt);
    updateSeasonParticles(dt); // Round 6：每季环境粒子 spawner
    updateParticles(dt);
    updateFloats(dt);
    updateRainbow(dt);        // Round 5：彩虹光环推进
    updateToasts(dt);  // Round 3：解锁成就 toast 推进
    updateSeasonBanner(dt);   // Round 6：季节切换 banner 推进
  }
  render();
  requestAnimationFrame(loop);
}

function render(){
  drawSky();
  drawCloud();
  drawSunMoon();
  drawGround();
  drawBeds();
  drawPlants();
  drawButterflies();
  drawFlyingSeeds();
  drawGroundSeeds();
  drawParticles();
  drawFloats();
  drawRainbowRing();        // Round 5：彩虹光环（在地面后、UI 前）
  drawSeedBag();
  drawToolButton();         // Round 5：工具圆形按钮（seedBag 旁）
  drawToolPanel();          // Round 5：工具升级面板（替换订单面板位置）
  drawOrders();
  drawWateringPot();
  drawTimeIndicator();
  drawShopButton();
  drawCoinHUD();
  drawSeasonCard();         // Round 6：季节倒计时卡
  drawDragSeed();
  drawArrow();
  drawShop();
  drawWarmTint();  // Round 4：红葵收获的屏幕 warm 滤镜
  drawToasts();  // Round 3：解锁成就 toast
  drawSeasonBanner();       // Round 6：季节切换 banner（最上层）
}

/* Round 4：红葵收获时的暖色滤镜（0.6 秒淡出） */
function drawWarmTint(){
  if(!STATE.warmTintT || STATE.warmTintT <= 0) return;
  const alpha = Math.min(0.18, STATE.warmTintT * 0.18);
  X.fillStyle = `rgba(255, 130, 60, ${alpha})`;
  X.fillRect(0, 0, W, H);
  STATE.warmTintT = Math.max(0, STATE.warmTintT - 0.016);
}

/* Round 5：L3 自动喷淋的彩虹光环（自场地中心向外扩散） */
function updateRainbow(dt){
  if(STATE.rainbowT > 0) STATE.rainbowT = Math.max(0, STATE.rainbowT - dt * 0.8);
}
function drawRainbowRing(){
  if(!STATE.rainbowT || STATE.rainbowT <= 0) return;
  const t = STATE.rainbowT;
  X.save();
  X.globalAlpha = t * 0.75;
  for(let i=0; i<4; i++){
    const r = (1 - t) * 320 + 40;
    const hue = (STATE.time*60 + i*90) % 360;
    X.strokeStyle = `hsl(${hue},85%,65%)`;
    X.lineWidth = 6;
    X.beginPath();
    X.arc(W/2, SCENE.groundY + 6, r, 0, TAU);
    X.stroke();
  }
  X.globalAlpha = 1;
  X.restore();
}

/* ============================================================
 *  启动
 * ============================================================ */
document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  STATE.started = true;
  // 初始只给 5 种基础 + 6 金币（够买 1 颗 3 金币的薰衣草）—— 不，初始金币 6，新种子 8 金币
  // 改：初始 3 金币 + 5 种基础，玩家卖花 1 朵就够买薰衣草
  STATE.seeds = { sun:1, rose:1, daisy:1, tulip:1, dand:1 }; // 初始 5 种基础各 1 颗
  STATE.groundSeeds = []; // 地上掉落种子
  STATE.coins = 3; // 初始 3 金币（卖 1 朵雏菊 4 金币 → 买 1 颗薰衣草 8 金币，需要卖 2 朵）
  STATE.unlocked = { sun:true, rose:true, daisy:true, tulip:true, dand:true, lavender:false, sakura:false, cactus:false, lotus:false, sunred:false };
  STATE.sunEnergy = 0;     // Round 4：向日葵收获累计阳光值
  STATE.warmTintT = 0;     // Round 4：红葵屏幕暖色滤镜计时器
  // Round 5：工具升级初始化
  STATE.tool = 1;
  STATE.toolUpgrades = { 1:true, 2:false, 3:false };
  STATE.toolPanelOpen = false;
  STATE.freeWaterNext = false;
  STATE.rainbowT = 0;
  // Round 6：四季系统初始化（春 / 第 1 天 / 无 banner）
  STATE.seasonIdx = 0;
  STATE.dayInSeason = 1;
  STATE.seasonBanner = null;
  // 默认解锁雪莲（先放进来，让玩家立刻能买到冬季限定种子）
  STATE.unlocked.winterflower = STATE.unlocked.winterflower || true;
  STATE.arrowTimer = 5;
  // v1 订单系统：开张第一单
  generateOrders();
  FADE.classList.add('hidden');
  showHint('从种子袋选一颗种子种到土里～', 3500);
});

resize();
requestAnimationFrame(loop);

/* ============================================================
 *  测试钩子（浏览器控制台可用）
 * ============================================================ */
window.__test = {
  plant: (id='sun') => {
    const def = SEEDS.find(s => s.id === id) || SEEDS[0];
    const bed = SCENE.beds.find(b => !b.occupied);
    if(bed) plantSeed(bed, def);
    return bed ? bed.plantId : null;
  },
  water: (pid) => {
    const p = STATE.plants.find(p => p.id === pid);
    if(p){ p.age = Math.min(1, p.age + 0.30); p.moisture = 1; p.waterTimer = 0; }
    return p ? p.age : null;
  },
  state: () => ({
    time: STATE.time.toFixed(1),
    dayTime: STATE.dayTime.toFixed(2),
    plants: STATE.plants.map(p => ({
      id: p.id, def: p.def.id, age: p.age.toFixed(3),
      moist: p.moisture.toFixed(2), bloom: p.hasBloomed,
      dead: p.dead, pollCount: p.pollCount,
    })),
    butterflies: STATE.butterflies.length,
    flyingSeeds: STATE.flyingSeeds.length,
    groundSeeds: STATE.groundSeeds.length,
    seeds: { ...STATE.seeds },
    coins: STATE.coins,
  }),
  advance: (sec=60) => {
    // 加速推进时间
    for(let i=0;i<sec*60;i++){
      updateDay(1/60);
      updatePlants(1/60);
      updateButterflies(1/60);
    }
    return __test.state();
  },
  toFlower: (id='sun') => {
    const def = SEEDS.find(s => s.id === id) || SEEDS[0];
    const bed = SCENE.beds.find(b => !b.occupied);
    if(!bed) return null;
    plantSeed(bed, def);
    const p = STATE.plants[STATE.plants.length-1];
    p.age = 1;
    p.hasBloomed = true;
    return p.id;
  },
  pollinate: (pid) => {
    const p = STATE.plants.find(p => p.id === pid);
    if(!p) return null;
    p.pollCount = 3;
    p.flowerSpent = true;
    if(p.def.dandelion) releaseDandelion(p);
    else releaseSeedFromFlower(p);
    return 'done';
  },
};
