<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>种子到花朵 · Seed to Flower</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f5ecd7;font-family:"Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #game{display:block;width:100vw;height:100vh;cursor:default;}
  #game.grab{cursor:grab;}
  #game.grabbing{cursor:grabbing;}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,250,230,.95);border:3px solid #d8a55a;border-radius:18px;padding:14px 22px;font-size:18px;color:#5a3a1a;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none;opacity:0;transition:opacity .4s;}
  #hint.show{opacity:1;}
  #fade{position:fixed;inset:0;background:#f5ecd7;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1s;z-index:10;}
  #fade h1{font-size:48px;margin:0 0 12px;color:#7a4a20;letter-spacing:4px;}
  #fade .sub{font-size:18px;color:#a07340;margin-bottom:36px;}
  #fade button{font-family:inherit;font-size:22px;padding:14px 48px;background:linear-gradient(180deg,#ffd87a,#f0a040);border:3px solid #c87020;border-radius:24px;color:#5a2a00;cursor:pointer;box-shadow:0 4px 0 #8a4a10,0 6px 12px rgba(0,0,0,.15);transition:transform .1s;}
  #fade button:active{transform:translateY(2px);box-shadow:0 2px 0 #8a4a10;}
  #fade.hidden{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint"></div>
<div id="fade">
  <h1>🌱 种子到花朵</h1>
  <div class="sub">种一颗种子，浇水，看它长大开花</div>
  <button id="startBtn">开始</button>
</div>

<script>
"use strict";

/* ============================================================
 *  种子到花朵 — 单 HTML 童趣观察游戏
 *  Canvas 2D · 60FPS · 零外部依赖
 * ============================================================ */

const C = document.getElementById('game');
const X = C.getContext('2d');
const HINT = document.getElementById('hint');
const FADE = document.getElementById('fade');

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  C.width = W * DPR; C.height = H * DPR;
  C.style.width = W + 'px'; C.style.height = H + 'px';
  X.setTransform(DPR,0,0,DPR,0,0);
  layoutScene();
}
window.addEventListener('resize', resize);

/* ---------- 工具 ---------- */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a) * t;
const rand = (a,b) => a + Math.random() * (b - a);
const randi = (a,b) => Math.floor(rand(a,b));
const choice = arr => arr[randi(0, arr.length)];

function showHint(text, ms=2400){
  HINT.textContent = text;
  HINT.classList.add('show');
  clearTimeout(showHint._t);
  showHint._t = setTimeout(()=> HINT.classList.remove('show'), ms);
}

/* ---------- Round 3：解锁成就 toast ---------- */
function showUnlockToast(seedId){
  const def = SEEDS.find(s => s.id === seedId);
  if(!def) return;
  STATE.toasts = STATE.toasts || [];
  STATE.toasts.push({
    emoji: '🌟',
    title: '解锁新种子！',
    name: def.name,
    seedEmoji: SEED_EMOJI[seedId] || '🌱',
    color: def.seedColor || '#e8a040',
    t: 0,
    life: 3.0,
    max: 3.0,
  });
}
function checkUnlock(seedId){
  if(!STATE.unlocked[seedId]){
    STATE.unlocked[seedId] = true;
    showUnlockToast(seedId);
  }
}

/* ---------- 种子类型 ----------
 * sellPrice: 卖花给订单的金币
 * buyPrice:  商店里直接买种子的金币（Round 4 新增）
 */
const SEEDS = [
  { id:'sun',  name:'向日葵',  seedColor:'#7a4a20', seedShape:'oval', growMs: 60000, sellPrice:5,  buyPrice:8,  flower:'sunflower', flowerColor:'#ffc830', flowerCore:'#5a2a00' },
  { id:'rose', name:'玫瑰',     seedColor:'#a83030', seedShape:'oval', growMs: 90000, sellPrice:7,  buyPrice:8,  flower:'rose',      flowerColor:'#e85070', flowerCore:'#a02040' },
  { id:'daisy',name:'雏菊',     seedColor:'#d8c890', seedShape:'oval', growMs: 45000, sellPrice:4,  buyPrice:5,  flower:'daisy',     flowerColor:'#ffffff', flowerCore:'#f0c040' },
  { id:'tulip',name:'郁金香',   seedColor:'#5a2a80', seedShape:'oval', growMs: 50000, sellPrice:5,  buyPrice:6,  flower:'tulip',     flowerColor:'#9050d0', flowerCore:'#6020a0' },
  { id:'dand', name:'蒲公英',   seedColor:'#e8d060', seedShape:'oval', growMs: 40000, sellPrice:3,  buyPrice:5,  flower:'dandelion', flowerColor:'#ffe040', flowerCore:'#fff8a0', dandelion:true },
  { id:'lavender', name:'薰衣草', seedColor:'#6a4a90', seedShape:'oval', growMs:30000, sellPrice:6,  buyPrice:12, flowerColor:'#8a5ac0', flowerCore:'#5028a0' },
  { id:'sakura',   name:'樱花',   seedColor:'#d080a0', seedShape:'oval', growMs:45000, sellPrice:12, buyPrice:30, flowerColor:'#ffb0d0', flowerCore:'#e060a0' },
  { id:'cactus',   name:'仙人掌', seedColor:'#3a6020', seedShape:'oval', growMs:25000, sellPrice:8,  buyPrice:15, flowerColor:'#5ba050', flowerCore:'#3a6020' },
  { id:'lotus',    name:'莲花',   seedColor:'#e0a0b0', seedShape:'oval', growMs:50000, sellPrice:18, buyPrice:20, flowerColor:'#ff80a0', flowerCore:'#fff0e0' },
  { id:'sunred',   name:'红葵',   seedColor:'#702010', seedShape:'oval', growMs:60000, sellPrice:25, buyPrice:25, flowerColor:'#e85030', flowerCore:'#5a2010' },
  // Round 6：冬季限定 — 雪莲
  { id:'winterflower', name:'雪莲', seedColor:'#a0c0e0', seedShape:'oval', growMs:50000, sellPrice:30, buyPrice:30, flowerColor:'#e0f0ff', flowerCore:'#90b8d8' },
];

/* ---------- 种子稀有度（采花掉落概率用） ---------- */
// 0 = common, 1 = uncommon, 2 = rare
const SEED_RARITY = {
  daisy: 0, dand: 0,                       // common
  rose: 1, sun: 1, tulip: 1, lavender: 1, cactus: 1,  // uncommon
  sakura: 2, lotus: 2, sunred: 2, winterflower: 2,  // rare
};

/* ---------- 种子锁定故事（每个未解锁种子 1 句） ---------- */
const LOCK_STORIES = {
  lavender: '紫色的香水～完成蜜蜂订单可买。',
  sakura:   '传说爷爷小时候在山顶种过…稀有订单解锁。',
  cactus:   '耐旱的小家伙～连续 5 单不失败解锁。',
  lotus:    '只在清晨开放…夜晚种下花可解锁。',
  sunred:   '夏天最热烈的花～连续 3 天完成订单。',
  winterflower: '雪山的奇迹～只能在冬天找到。',
};
const SEED_EMOJI = {
  sun:'🌻', rose:'🌹', daisy:'🌼', tulip:'🌷', dand:'🌾',
  lavender:'💜', sakura:'🌸', cactus:'🌵', lotus:'🪷', sunred:'🔥', winterflower:'❄️',
};

/* ============================================================
 *  Round 6：四季 + 季节限定花
 *  seasonIdx: 0=spring, 1=summer, 2=autumn, 3=winter
 *  1 季 = 5 game-days (用 STATE.orderDay % 5 跟踪)
 *  flowers[] = 当季正常生长 (1.0x)；其他季 0.5x（季节加成惩罚）
 *  全 cycle = 20 天
 * ============================================================ */
const SEASONS = [
  {
    name:'春', emoji:'🌸',
    skyDay: ['#d8e8c0', '#e8e0d0', '#f0c8d8'],     // 上 / 中 / 下
    ground: ['#7ac050', '#4a8030'],
    sunTint: '#ffe890', moonTint: '#dfe8f8',
    flowers: ['sun', 'rose', 'daisy', 'tulip', 'lotus'],
    npcId: 'deer', npcName: '小鹿', npcEmoji: '🦌',
    npcWant: ['daisy', 'lotus', 'rose'], npcBonus: 1.4,
    ambientKind: 'pollen', ambientColor: '#ffc0d8',
  },
  {
    name:'夏', emoji:'☀️',
    skyDay: ['#f8e8a0', '#f8c870', '#f0a060'],
    ground: ['#c8c050', '#908030'],
    sunTint: '#ffd040', moonTint: '#fff0c0',
    flowers: ['sun', 'dand', 'daisy', 'cactus', 'sunred'],
    npcId: 'firefly', npcName: '萤火虫', npcEmoji: '🔥',
    npcWant: ['sun', 'sunred', 'dand'], npcBonus: 1.2,
    ambientKind: 'firefly', ambientColor: '#ffe040',
  },
  {
    name:'秋', emoji:'🍁',
    skyDay: ['#f0b860', '#e8a060', '#d04030'],
    ground: ['#d09050', '#a06030'],
    sunTint: '#ffc060', moonTint: '#e8d0b0',
    flowers: ['rose', 'tulip', 'sakura', 'dand', 'sun'],
    npcId: 'squirrel', npcName: '小松鼠', npcEmoji: '🐿️',
    npcWant: ['sakura', 'dand'], npcBonus: 1.5,
    ambientKind: 'leaf', ambientColor: '#e07030',
  },
  {
    name:'冬', emoji:'❄️',
    skyDay: ['#c0d8f0', '#d0e0f0', '#e8f0f8'],
    ground: ['#e8e8f0', '#c0c8d0'],
    sunTint: '#e8eef8', moonTint: '#ffffff',
    flowers: ['lavender', 'cactus', 'winterflower'],
    npcId: 'penguin', npcName: '小企鹅', npcEmoji: '🐧',
    npcWant: ['winterflower', 'lavender', 'cactus'], npcBonus: 1.3,
    ambientKind: 'snow', ambientColor: '#ffffff',
  },
];
const SEASON_LIST = ['spring', 'summer', 'autumn', 'winter'];

function currentSeason(){
  return SEASONS[STATE.seasonIdx | 0];
}
function seasonCanBloom(def){
  const s = currentSeason();
  return s.flowers.includes(def.id);
}

/* ============================================================
 *  Round 5：工具等级定义
 *  L1 浇水壶（默认）— 1 坛 +30%
 *  L2 洒水壶 — 相邻 2 坛 +50%（30 金币）
 *  L3 自动喷淋 — 全场 +30%（80 金币 + 50 声望；每次使用 3 金币）
 * ============================================================ */
const TOOL_LEVELS = [
  { level:1, name:'浇水壶',   emoji:'💧', desc:'1 坛',     moistureGain:0.30, color:'#6ab0d8' },
  { level:2, name:'洒水壶',   emoji:'💦', desc:'相邻 2 坛', moistureGain:0.50, color:'#5ac080' },
  { level:3, name:'自动喷淋', emoji:'⭐', desc:'全场所有', moistureGain:0.30, color:'#f0d040' },
];
const TOOL_UPGRADE_PRICE = { 2: 30, 3: 80 };
const TOOL_UPGRADE_REP    = { 3: 50 };
const TOOL_USE_COST       = { 3: 3 };  // L3 每次喷淋 3 金币

function rollDropDefId(plantDef){
  // 蒲公英：固定掉落自己（蒲公英种子很珍贵）
  if(plantDef.dandelion) return 'dand';
  const r = Math.random();
  const myRarity = SEED_RARITY[plantDef.id] ?? 0;
  if(r < 0.80){
    return plantDef.id;  // 80% 同种
  } else if(r < 0.95){
    // 15% 更稀有种（至少比当前 +1 阶）
    const candidates = SEEDS.filter(s => (SEED_RARITY[s.id] ?? 0) > myRarity);
    if(candidates.length) return choice(candidates).id;
    return plantDef.id;
  } else {
    // 5% 普通种（common）
    const candidates = SEEDS.filter(s => (SEED_RARITY[s.id] ?? 0) === 0);
    if(candidates.length) return choice(candidates).id;
    return plantDef.id;
  }
}

/* ============================================================
 *  Round 4：特殊花朵特性掉落
 *  - 蒲公英 (dand): 保证 2 颗（普通粒 + 飞散）
 *  - 樱花 (sakura): 额外 2-3 颗（含 1 个未解锁种子）
 *  - 睡莲 (lotus): 夜晚收获 +50% 金币；白天 30% 几率掉 1 颗蒲公英
 *  - 向日葵 (sun): +1 阳光（占位，本轮不实装季节系统）
 *  - 薰衣草 (lavender): 蜂 NPC 好感 +2
 *  - 红葵 (sunred): 屏幕 warm tint + 🔥 粒子飘字
 *  - 仙人掌 (cactus): 额外 +10 金币
 *  参数 fx/fy: 花朵中心（用于粒子/种子飞出位置）
 * ============================================================ */
function harvestSpecialBonus(plant, fx, fy){
  const id = plant.def.id;
  STATE.floats = STATE.floats || [];
  STATE.groundSeeds = STATE.groundSeeds || [];

  // 蒲公英：保证 2 颗
  if(id === 'dand'){
    STATE.groundSeeds.push({
      defId:'dand', x: fx + rand(-10, 10), y: fy - 6,
      vx: rand(-30, 30), vy: rand(-100, -60), t: 0,
    });
    STATE.floats.push({ x: fx, y: fy - 30, text: '🌾×2 保证！', t: 0, color: '#d0a020' });
    return;
  }

  // 樱花：2-3 颗，其中 1 颗是未解锁的种子
  if(id === 'sakura'){
    const bonusCount = 2 + (Math.random() < 0.5 ? 1 : 0);
    for(let i=0; i<bonusCount; i++){
      let defId;
      if(i === 0){
        // 第 1 颗：随机未解锁的种子（玩家首遇新种）
        const locked = SEEDS.filter(s => !STATE.unlocked[s.id]);
        defId = locked.length ? choice(locked).id : choice(SEEDS).id;
      } else {
        defId = rollDropDefId(plant.def);
      }
      STATE.groundSeeds.push({
        defId, x: fx + rand(-14, 14), y: fy - 4 - i * 4,
        vx: rand(-40, 40), vy: rand(-110, -60), t: 0,
      });
    }
    STATE.floats.push({ x: fx, y: fy - 30, text: `🌸 樱花之礼 +${bonusCount} 颗！`, t: 0, color: '#e060a0' });
    // 10 颗粉色花瓣
    for(let i=0;i<10;i++){
      STATE.particles.push({
        x: fx, y: fy,
        vx: rand(-100, 100), vy: rand(-140, -50),
        g: 180, size: rand(4, 7),
        color: '#ffb0d0', life: 1.5, t: 0, kind: 'petal',
      });
    }
    return;
  }

  // 睡莲：夜晚 +50% 金币 / 白天 30% 几率掉蒲公英
  if(id === 'lotus'){
    if(typeof isNight === 'function' && isNight()){
      const bonus = Math.ceil((plant.def.sellPrice || 18) * 0.5);
      STATE.coins += bonus;
      STATE.floats.push({ x: fx, y: fy - 30, text: `🌙 莲花夜赏 +${bonus}💰`, t: 0, color: '#7090e0' });
    } else if(Math.random() < 0.3){
      STATE.groundSeeds.push({
        defId: 'dand', x: fx + rand(-8, 8), y: fy - 6,
        vx: rand(-30, 30), vy: rand(-90, -50), t: 0,
      });
      STATE.floats.push({ x: fx, y: fy - 30, text: '🪷 赠蒲公英种 1 颗', t: 0, color: '#ffe040' });
    }
    return;
  }

  // 向日葵：+1 阳光（占位 — 未来季节系统用）
  if(id === 'sun'){
    STATE.sunEnergy = (STATE.sunEnergy || 0) + 1;
    STATE.floats.push({ x: fx, y: fy - 30, text: '☀️+1 阳光值', t: 0, color: '#ffb000' });
    // 4 颗小光点
    for(let i=0;i<4;i++){
      STATE.particles.push({
        x: fx, y: fy,
        vx: rand(-50, 50), vy: rand(-110, -50),
        g: 160, size: rand(2, 4),
        color: '#ffe060', life: 0.8, t: 0, kind: 'sparkle',
      });
    }
    return;
  }

  // 薰衣草：蜂 NPC 好感 +2
  if(id === 'lavender'){
    STATE.npcFav.bee = (STATE.npcFav.bee || 0) + 2;
    STATE.floats.push({ x: fx, y: fy - 30, text: '🐝 蜂蜂 +2 好感', t: 0, color: '#8a5ac0' });
    for(let i=0;i<6;i++){
      STATE.particles.push({
        x: fx, y: fy,
        vx: rand(-60, 60), vy: rand(-100, -40),
        g: 180, size: rand(2, 4),
        color: '#a070d0', life: 1.0, t: 0, kind: 'sparkle',
      });
    }
    return;
  }

  // 红葵：warm tint + 🔥 飘字 + 火色粒子
  if(id === 'sunred'){
    STATE.floats.push({ x: fx, y: fy - 30, text: '🔥 红葵盛放！', t: 0, color: '#e85030' });
    // 8 颗火焰粒子
    for(let i=0;i<8;i++){
      STATE.particles.push({
        x: fx, y: fy,
        vx: rand(-70, 70), vy: rand(-130, -50),
        g: 160, size: rand(3, 5),
        color: Math.random() < 0.5 ? '#ff7030' : '#e85030',
        life: 1.2, t: 0, kind: 'sparkle',
      });
    }
    // 屏幕 warm tint 标记（main 渲染读）
    STATE.warmTintT = (STATE.warmTintT || 0) + 0.6;
    return;
  }

  // 仙人掌：额外 +10 金币（沙漠价）
  if(id === 'cactus'){
    STATE.coins += 10;
    STATE.floats.push({ x: fx, y: fy - 30, text: '🌵 沙漠金币 +10💰', t: 0, color: '#5ba050' });
    return;
  }
}

/* ============================================================
 *  Round 4：3 次收获枯萎 → 额外爆出 1 颗最稀有花的种子
 *  在 plant.harvests >= 3 触发死亡时调用一次
 * ============================================================ */
function harvestFinalBonus(plant, fx, fy){
  STATE.groundSeeds = STATE.groundSeeds || [];
  // 找当前最稀有（SEED_RARITY 最大）的种子
  let best = SEEDS[0];
  for(const s of SEEDS){
    if((SEED_RARITY[s.id] ?? 0) > (SEED_RARITY[best.id] ?? 0)) best = s;
  }
  STATE.groundSeeds.push({
    defId: best.id, x: fx + rand(-10, 10), y: fy - 4,
    vx: rand(-30, 30), vy: rand(-100, -60), t: 0,
  });
  STATE.floats = STATE.floats || [];
  STATE.floats.push({ x: fx, y: fy - 50, text: `🎁 终末礼物 ${SEED_EMOJI[best.id]||'🌱'}${best.name}种`, t: 0, color: '#d040c0' });
  // 一圈星粒子
  for(let i=0;i<12;i++){
    const a = (i / 12) * TAU;
    STATE.particles.push({
      x: fx, y: fy,
      vx: Math.cos(a) * 80, vy: Math.sin(a) * 80 - 40,
      g: 160, size: rand(3, 5),
      color: '#ffd040', life: 1.2, t: 0, kind: 'sparkle',
    });
  }
}

/* ---------- 全局状态 ---------- */
const STATE = {
  started: false,
  time: 0,         // 现实流逝秒
  dayTime: 0,      // 0..1 一天中的位置
  dayLen: 180,     // 现实秒 = 游戏一天
  nightSlow: 0.5,  // 夜晚生长速度
  dragSeed: null,  // 当前拖动的种子 {seedDef, x, y, offsetX, offsetY}
  holdingPot: false,
  pot: { x: 0, y: 0, vx: 0, angle: 0, swing: 0, lastDir: 0, swings: 0, drops: 0 },
  mouse: { x: -100, y: -100, down: false },
  arrowTimer: 0,   // 开场引导倒计时
  plants: [],      // 场景里正在生长的植物
  particles: [],   // 通用粒子（水滴/花粉/星点）
  butterflies: [], // 蝴蝶
  seeds: {},       // 种子库存：defId → 数量（采花掉落、商店购买都进这里）
  groundSeeds: [], // 地上掉落的种子（点中后入库）
  selectedSeed: null, // 当前选中的种子 id（用于种子袋高亮）
  flyingSeeds: [], // 飞散的种子（蒲公英种子飞散后的可捡种子）
  coins: 6,         // 初始 6 金币
  shopOpen: false,
  unlocked: { sun:true, rose:true, daisy:true, tulip:true, dand:true, lavender:false, sakura:false, cactus:false, lotus:false, sunred:false, winterflower:true },
  hint: '',
  hintT: 0,
  // v1 订单系统
  orders: [],          // 当前 3 个订单
  orderDay: 0,         // 当前是第几天（重置订单）
  orderIndex: 0,       // 已完成订单数
  orderTotal: 0,       // 总完成订单
  reputation: 0,       // 声望 0..100
  // Round 2：NPC 好感度（每完成一笔订单 +1，未来可能影响交易）
  npcFav: { bunny:0, bear:0, fox:0, cat:0, bee:0 },
  // Round 3：解锁成就 toast 队列（顶部堆叠 + 淡入淡出）
  toasts: [],
  // Round 5：工具升级系统
  tool: 1,                                // 当前装备等级 1/2/3
  toolUpgrades: { 1:true, 2:false, 3:false }, // 已解锁等级
  toolPanelOpen: false,                   // 升级面板是否打开
  freeWaterNext: false,                   // L3：下次喷淋免费 toggle

/* ---------- 订单生成 ---------- */
function generateOrders(){
  STATE.orders = [];
  const used = new Set();
  // Round 6：按当前 season 过滤 NPC —— 季节限定 NPC 仅在当季可选
  const curSeasonIdx = STATE.seasonIdx | 0;
  const npcs = NPCS.filter(n => n.season === undefined || n.season === curSeasonIdx);
  // 退化保护：万一当前季没有匹配 NPC，回退到常驻 NPC
  const pool = npcs.length ? npcs : NPCS.filter(n => n.season === undefined);
  for(let i=0;i<3;i++){
    let npc;
    if(used.size < pool.length){
      do { npc = pool[randi(0, pool.length)]; } while(used.has(npc.id));
    } else {
      npc = pool[randi(0, pool.length)];
    }
    used.add(npc.id);
    const wantId = npc.want[randi(0, npc.want.length)];
    const flower = SEEDS.find(s => s.id === wantId);
    if(!flower) continue;
    STATE.orders.push({
      id: Math.random(),
      npc,
      wantId,
      wantName: flower.name,
      wantColor: flower.flowerColor,
      pay: Math.max(1, Math.floor(flower.sellPrice * npc.bonus * 1.5)),
      timeLeft: 180,
      done: false,
      failed: false,
    });
  }
}

function completeOrder(order, plant){
  order.done = true;
  STATE.coins += order.pay;
  STATE.reputation = Math.min(100, STATE.reputation + 10);
  STATE.orderIndex += 1;
  STATE.orderTotal += 1;
  // Round 2：NPC 好感度 +1
  const npcId = order.npc && order.npc.id;
  if(npcId){
    STATE.npcFav[npcId] = (STATE.npcFav[npcId] || 0) + 1;
  }
  // Round 2：NPC 礼物种子（按订单花的稀有度计算数量）
  const rarity = SEED_RARITY[order.wantId] ?? 0;
  let seedCount;
  if(rarity === 0) seedCount = 1;                           // common: 1 颗
  else if(rarity === 1) seedCount = Math.random() < 0.5 ? 1 : 2; // uncommon: 1-2 颗
  else seedCount = 2;                                        // rare: 2 颗
  // 标记花被采走（按一次收获）
  plant.harvests = (plant.harvests || 0) + 1;
  plant.harvestScale = Math.max(0.4, 1 - plant.harvests * 0.18);
  if(plant.def.dandelion){
    plant.flowerSpent = true;
    plant.dead = true;
    setTimeout(() => { plant.bed.occupied = false; }, 500);
  } else if(plant.harvests >= 3){
    plant.dead = true;
    plant.flowerSpent = true;
    // Round 4：终末礼物 — 额外 1 颗最稀有花种子（订单 + 收获同时到达 3 次时）
    harvestFinalBonus(plant, fx, fy);
    setTimeout(() => { plant.bed.occupied = false; }, 800);
  }
  // 飘字 + 礼物种子从花朵中心爆出
  const stemH = 60;
  const fx = plant.bed.cx;
  const fy = plant.bed.cy - stemH * plant.age;
  STATE.floats = STATE.floats || [];
  STATE.floats.push({ x:fx, y:fy-20, text:`+${order.pay}💰`, t:0, color:'#e8a020' });
  // Round 2：种子奖励飘字
  STATE.floats.push({
    x: fx, y: fy - 40,
    text: `+🌱${seedCount}${order.wantName}种子`,
    t: 0, color: '#5a8a20',
  });
  // Round 2：种子从花朵中心爆出（落地后可拾起 → 入库）
  STATE.groundSeeds = STATE.groundSeeds || [];
  for(let i=0;i<seedCount;i++){
    STATE.groundSeeds.push({
      defId: order.wantId,
      x: fx + rand(-6, 6),
      y: fy - 4 - i * 4,
      vx: rand(-40, 40),
      vy: rand(-100, -60),
      t: 0,
    });
  }
  // 报恩花粒子
  for(let i=0;i<10;i++){
    STATE.particles.push({
      x: fx, y: fy,
      vx: rand(-80, 80), vy: rand(-120, -40),
      g: 200, size: rand(3, 6),
      color: order.wantColor,
      life: 1.2, t: 0,
      kind: 'petal',
    });
  }
  showHint(`${order.npc.name} 拿走了 ${order.wantName}！+${order.pay}💰 +🌱${seedCount}种子 ⭐+10 ❤️+1`);
  if(typeof playDing === 'function') playDing();
}

function layoutScene(){

  SCENE.beds.length = 0;
  const margin = W * 0.12;

  for(let i=0;i<SCENE.bedCount;i++){

      x: cx - bw/2, y: SCENE.groundY - 18, w: bw, h: 50,

/* ============================================================
 *  输入
 * ============================================================ */
function getPos(e){
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

C.addEventListener('mousemove', e => {
  const p = getPos(e);
  // 记录上一帧位置算 vx（用于壶柄角度）
  const ox = STATE.mouse.x, oy = STATE.mouse.y;
  STATE.mouse.x = p.x; STATE.mouse.y = p.y;
  STATE.mouse.vx = p.x - ox;
  STATE.mouse.vy = p.y - oy;
  if(STATE.dragSeed){
    STATE.dragSeed.x = p.x - STATE.dragSeed.offsetX;
    STATE.dragSeed.y = p.y - STATE.dragSeed.offsetY;
  }
  if(STATE.holdingPot){
    STATE.pot.x = p.x; STATE.pot.y = p.y;
  }
});
C.addEventListener('mousedown', e => {
  if(!STATE.started) return;
  STATE.mouse.down = true;
  handleClick(getPos(e));
});
C.addEventListener('mouseup', () => { STATE.mouse.down = false; });
C.addEventListener('touchstart', e => {
  if(!STATE.started) return;
  e.preventDefault();
  const p = getPos(e);
  STATE.mouse.x = p.x; STATE.mouse.y = p.y; STATE.mouse.down = true;
  handleClick(p);
}, {passive:false});
C.addEventListener('touchmove', e => {
  e.preventDefault();
  const p = getPos(e);
  const ox = STATE.mouse.x, oy = STATE.mouse.y;
  STATE.mouse.x = p.x; STATE.mouse.y = p.y;
  STATE.mouse.vx = p.x - ox;
  STATE.mouse.vy = p.y - oy;
  if(STATE.dragSeed){
    STATE.dragSeed.x = p.x - STATE.dragSeed.offsetX;
    STATE.dragSeed.y = p.y - STATE.dragSeed.offsetY;
  }
  if(STATE.holdingPot){
    STATE.pot.x = p.x; STATE.pot.y = p.y;
  }
}, {passive:false});
C.addEventListener('touchend', () => { STATE.mouse.down = false; });

function pointInBox(px,py,b){ return px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h; }

function handleClick(p){
  // 0. 商店按钮
  if(pointInBox(p.x, p.y, SCENE.shopBtn)){
    STATE.shopOpen = !STATE.shopOpen;
    return;
  }
  // 0b. 商店关闭按钮
  if(STATE.shopOpen && pointInBox(p.x, p.y, SCENE.shopClose)){
    STATE.shopOpen = false;
    return;
  }
  // 0c. 商店内买种子
  if(STATE.shopOpen){
    for(const def of SEEDS){
      if(def._buyBox && pointInBox(p.x, p.y, def._buyBox)){
        const price = def.buyPrice || 8;
        if(STATE.coins >= price){
          STATE.coins -= price;
          STATE.seeds[def.id] = (STATE.seeds[def.id] || 0) + 1;
          checkUnlock(def.id);  // Round 3：解锁 toast（首次 false→true 时弹）
          showHint(`买了 ${def.name}！-${price}💰`);
        } else {
          showHint('💰 金币不足');
        }
        return;
      }
    }
    return;  // 商店打开时点击不传给下面
  }
  // 1. 时间指示可点击跳过
  if(pointInBox(p.x, p.y, SCENE.timeBox)){
    STATE.dayTime = (STATE.dayTime + 0.25) % 1;
    showHint('时间跳了一格');
    return;
  }
  // 2. 浇水壶：点击拿起/放下
  if(pointInBox(p.x, p.y, SCENE.potBox)){
    STATE.holdingPot = !STATE.holdingPot;
    if(STATE.holdingPot){
      STATE.pot.x = p.x; STATE.pot.y = p.y;
      STATE.pot.swings = 0; STATE.pot.drops = 0;
      STATE.pot.lastDir = 0;
      showHint('点击一下 = 浇透一次～');
    }
    return;
  }
  // 2b. 工具按钮（圆形，左上角）→ 切升级面板
  if(pointInBox(p.x, p.y, SCENE.toolBox)){
    STATE.toolPanelOpen = !STATE.toolPanelOpen;
    return;
  }
  // 2c. L3 星形 toggle（壶盒右上角，仅 L3 时显示）
  if(STATE.tool === 3 && pointInBox(p.x, p.y, SCENE.starToggle)){
    STATE.freeWaterNext = !STATE.freeWaterNext;
    showHint(STATE.freeWaterNext ? '⭐ 下次喷淋免费 ON' : '⭐ 免费 toggle OFF');
    return;
  }
  // 2d. 工具升级面板内的"升级"按钮
  if(STATE.toolPanelOpen && pointInBox(p.x, p.y, SCENE.toolPanel)){
    for(let i=0; i<3; i++){
      const lv = i + 1;
      const def = TOOL_LEVELS[i];
      if(def._upgradeBox && pointInBox(p.x, p.y, def._upgradeBox)){
        if(STATE.toolUpgrades[lv]) continue;
        const cost = TOOL_UPGRADE_PRICE[lv] || 0;
        const repReq = TOOL_UPGRADE_REP[lv] || 0;
        if(STATE.coins < cost){
          showHint('💰 金币不足');
          return;
        }
        if(STATE.reputation < repReq){
          showHint(`⭐ 声望不足（需 ${repReq}）`);
          return;
        }
        STATE.coins -= cost;
        STATE.toolUpgrades[lv] = true;
        STATE.tool = lv;
        showHint(`🔧 升级 ${def.name}！装备中`);
        if(typeof playDing === 'function') playDing();
        return;
      }
    }
    return;  // 点在面板内但没点中按钮
  }
  // 3. 种子袋：选种子 / 点"+"跳商店 / Round 3：点未解锁的种子显示故事
  if(pointInBox(p.x, p.y, SCENE.bagBox)){
    // 先看是不是点"+"按钮
    if(SCENE.bagPlus && pointInBox(p.x, p.y, SCENE.bagPlus)){
      STATE.shopOpen = true;
      return;
    }
    // 否则按 _bagBox 找点中了哪个种子
    for(const def of SEEDS){
      if(def._bagBox && pointInBox(p.x, p.y, def._bagBox)){
        const unlocked = STATE.unlocked[def.id];
        const cnt = STATE.seeds[def.id] || 0;
        if(!unlocked){
          // 未解锁：显示 1 句故事 + 解锁提示
          const story = LOCK_STORIES[def.id] || '神秘种子…';
          showHint(`❓ ${def.name}：${story}`, 3500);
        } else if(cnt <= 0){
          showHint(`${def.name} 库存为 0，去商店买或采花～`);
        } else {
          STATE.seeds[def.id] -= 1;  // 从库存拿出 1 颗
          STATE.selectedSeed = def.id;
          STATE.dragSeed = {
            def, x: p.x - 20, y: p.y - 20, offsetX:20, offsetY:20,
          };
          C.classList.add('grabbing');
          checkUnlock(def.id);  // 已解锁种子防御性二次确认
        }
        return;
      }
    }
  }
  // 4. 如果正在拖动种子，尝试种下
  if(STATE.dragSeed){
    const bed = findBedAt(p.x, p.y);
    if(bed && !bed.occupied){
      plantSeed(bed, STATE.dragSeed.def);
      STATE.dragSeed = null;
      C.classList.remove('grabbing');
      showHint('点击一下 = 浇透一次～');
      return;
    } else {
      // 拖到无效位置 → 退回库存（避免种子凭空消失）
      if(STATE.dragSeed && STATE.dragSeed.def){
        const did = STATE.dragSeed.def.id;
        STATE.seeds[did] = (STATE.seeds[did] || 0) + 1;
      }
      STATE.dragSeed = null;
      C.classList.remove('grabbing');
    }
  }
  // 5. 飞散种子可捡回（蒲公英/授粉后的）→ 入库
  for(let i=STATE.flyingSeeds.length-1; i>=0; i--){
    const s = STATE.flyingSeeds[i];
    if(Math.hypot(s.x-p.x, s.y-p.y) < 24){
      STATE.seeds[s.defId] = (STATE.seeds[s.defId] || 0) + 1;
      checkUnlock(s.defId);  // Round 3：首次入库 → 解锁 toast
      STATE.flyingSeeds.splice(i,1);
      const def = SEEDS.find(d => d.id === s.defId);
      showHint(`+1 ${def ? def.name : ''}种子`);
      return;
    }
  }
  // 5b. 地上掉落种子可捡起 → 入库 + 飘字 + 叮咚声
  for(let i=STATE.groundSeeds.length-1; i>=0; i--){
    const s = STATE.groundSeeds[i];
    if(Math.hypot(s.x-p.x, s.y-p.y) < 16){
      STATE.seeds[s.defId] = (STATE.seeds[s.defId] || 0) + 1;
      checkUnlock(s.defId);  // Round 3：首次入库 → 解锁 toast
      const def = SEEDS.find(d => d.id === s.defId);
      STATE.floats = STATE.floats || [];
      STATE.floats.push({
        x: s.x, y: s.y - 10,
        text: `+1 ${def ? def.name : ''}种子`,
        t: 0, color: '#7a4a20',
      });
      STATE.groundSeeds.splice(i, 1);
      playSeedPop();
      return;
    }
  }
  // 5.5 收获成熟花：点中花朵 → +金币 + 飘花瓣 + 采 3 次后枯萎
  if(!STATE.holdingPot && !STATE.dragSeed){
    for(const plant of STATE.plants){
      if(plant.dead || plant.flowerSpent) continue;
      if(plant.age < 0.9) continue;  // 未成熟
      // 花朵中心在 plant.bed.cx, plant.bed.cy - stemH*k
      const stemH = 60;
      const fx = plant.bed.cx;
      const fy = plant.bed.cy - stemH * plant.age;
      // 点击命中范围 30px
      if(Math.hypot(fx - p.x, fy - p.y) < 32){
        harvestPlant(plant);
        return;
      }
    }
  }
  // 6. 拿着壶时点空白处 → 浇水（按工具等级 L1/L2/L3 行为不同）
  if(STATE.holdingPot){
    const tool = STATE.tool || 1;
    if(tool === 3){
      // === L3 自动喷淋：全场所有植物一起浇 ===
      const livePlants = STATE.plants.filter(p => !p.dead);
      if(!livePlants.length){
        showHint('没有花可浇～');
        return;
      }
      let cost = 0;
      if(!STATE.freeWaterNext){
        cost = TOOL_USE_COST[3] || 0;
        if(STATE.coins < cost){
          showHint('💰 金币不足，无法喷淋');
          return;
        }
        STATE.coins -= cost;
      } else {
        STATE.freeWaterNext = false;
      }
      // 浇所有植物
      for(const p of livePlants) waterFully(p, TOOL_LEVELS[2].moistureGain);
      // 视觉：星雨（从天而降）+ 彩虹光环
      for(let i=0;i<18;i++){
        spawnStarDrop(rand(0, W), rand(-40, 10));
      }
      STATE.rainbowT = 1.0;
      playSplash();
      showHint(cost > 0 ? `⭐ 全场喷淋 -${cost}💰` : '⭐ 全场喷淋（免费）');
    } else if(tool === 2){
      // === L2 洒水壶：该坛 + 相邻 1 坛 ===
      const nearest = nearestPlant(STATE.mouse.x, STATE.mouse.y);
      if(nearest && nearest.def){
        const beds = SCENE.beds;
        const idx = beds.indexOf(nearest.bed);
        const targets = [nearest];
        if(idx > 0){
          const p2 = STATE.plants.find(pp => pp.bed === beds[idx-1] && !pp.dead);
          if(p2) targets.push(p2);
        }
        if(idx < beds.length - 1){
          const p3 = STATE.plants.find(pp => pp.bed === beds[idx+1] && !pp.dead);
          if(p3) targets.push(p3);
        }
        for(const p of targets){
          waterFully(p, TOOL_LEVELS[1].moistureGain);
          // 视觉：成片雨滴（比 L1 多）
          for(let i=0;i<10;i++){
            spawnDrop(p.bed.cx + rand(-30, 30), p.bed.cy - 50 + rand(-20, 20));
          }
        }
        playSplash();
      }
    } else {
      // === L1 浇水壶：单坛（沿用原行为）===
      const nearest = nearestPlant(STATE.mouse.x, STATE.mouse.y);
      if(nearest && nearest.def){
        nearest.moisture = 1;
        nearest.waterTimer = 0;
        nearest.bed.moisture = Math.min(1, nearest.bed.moisture + 0.5);
        for(let i=0;i<5;i++) spawnDrop(STATE.pot.x + 14, STATE.pot.y - 6);
        playSplash();
        waterFully(nearest);
      }
    }
  }
  // 7. 订单面板：点中"卖"按钮 → 提交订单
  if(SCENE.orderBox && pointInBox(p.x, p.y, SCENE.orderBox)){
    // 先精确匹配"卖"按钮（每行一个）
    for(const o of STATE.orders){
      if(o.done) continue;
      if(o._sellBox && pointInBox(p.x, p.y, o._sellBox)){
        const plant = STATE.plants.find(pl => !pl.dead && pl.def.id === o.wantId && pl.age >= 0.9);
        if(plant){
          completeOrder(o, plant);
        } else {
          showHint(`还没有 ${o.wantName} 成熟～`);
        }
        return;
      }
    }
    // 否则按面板区域：尝试第一个未完成订单
    for(const o of STATE.orders){
      if(o.done) continue;
      const plant = STATE.plants.find(pl => !pl.dead && pl.def.id === o.wantId && pl.age >= 0.9);
      if(plant){
        completeOrder(o, plant);
      } else {
        showHint(`还没有 ${o.wantName} 成熟～`);
      }
      return;
    }
  }
}

function findBedAt(x,y){
  return SCENE.beds.find(b => x>=b.x-10 && x<=b.x+b.w+10 && y>=b.y-30 && y<=b.y+b.h+20);
}

function plantSeed(bed, def){
  const plant = {
    id: Math.random(),
    bed, def,
    age: 0,           // 生长进度 0..1
    moisture: 0,      // 0..1 当前水量
    waterTimer: 0,    // 自上次浇水以来的秒数
    phase: Math.random() * TAU,
    pollCount: 0,     // 授粉次数
    pollinated: false,
    dead: false,
    hasBloomed: false,
    flowerSpent: false, // 蒲公英绒球飞散后
    lastFlowerPos: null,
  };
  bed.occupied = true;
  bed.plantId = plant.id;
  bed.moisture = 0;
  STATE.plants.push(plant);
}

/* ============================================================
 *  浇水壶：点击一下 = 浇透
 * ============================================================ */
function updatePot(dt){
  if(!STATE.holdingPot) {
    STATE.pot.swing *= 0.9;
    STATE.pot.angle = lerp(STATE.pot.angle, 0, 0.2);
    return;
  }
  // 鼠标位置跟着壶
  STATE.pot.x = STATE.mouse.x;
  STATE.pot.y = STATE.mouse.y;
  // 壶柄轻摇（按鼠标速度给小角度）
  const dx = STATE.mouse.vx;
  STATE.pot.vx = dx;
  const target = clamp(dx * 0.04, -0.4, 0.4);
  STATE.pot.angle = lerp(STATE.pot.angle, target, 0.25);
  STATE.pot.swing = Math.abs(STATE.pot.angle);
}

function nearestPlant(x,y){
  let best = null, bd = 1e9;
  for(const p of STATE.plants){
    if(p.dead) continue;
    const d = Math.hypot(p.bed.cx - x, p.bed.cy - y);
    if(d < bd){ bd = d; best = p; }
  }
  return best;
}

function waterFully(plant, gain){
  // Round 5：gain 可选，默认查当前工具等级表
  const g = gain != null ? gain : (TOOL_LEVELS[(STATE.tool||1) - 1].moistureGain);
  plant.age = Math.min(1, plant.age + g);
  plant.moisture = 1;
  plant.waterTimer = 0;
  showHint('浇了一次水～ +' + Math.round(g*100) + '%');
}

function harvestPlant(plant){
  // 多次收获：每次 +金币，3 次后枯萎
  plant.harvests = (plant.harvests || 0) + 1;
  const reward = plant.def.sellPrice || 5;
  STATE.coins += reward;
  // 飘字
  const stemH = 60;
  const fx = plant.bed.cx;
  const fy = plant.bed.cy - stemH * plant.age;
  STATE.floats = STATE.floats || [];
  STATE.floats.push({ x:fx, y:fy-20, text:`+${reward}💰`, t:0, color:'#e8a020' });
  // 花瓣飘落粒子
  const petalColor = plant.def.flowerColor || '#ff80a0';
  for(let i=0;i<8;i++){
    STATE.particles.push({
      x: fx, y: fy,
      vx: rand(-80, 80), vy: rand(-120, -40),
      g: 200, size: rand(3, 6),
      color: petalColor,
      life: 1.2, t: 0,
      kind: 'petal',
    });
  }
  // 播放叮咚声
  if(typeof playDing === 'function') playDing();
  // 视觉反馈：花变小（每次 -15% 大小）
  plant.harvestScale = Math.max(0.4, 1 - plant.harvests * 0.18);
  // === Round 1：采花掉落种子（仅第一次收获时掉落；必须在蒲公英 return 之前） ===
  if(!plant._droppedSeed){
    plant._droppedSeed = true;
    // 蒲公英固定 1 颗；其他 50% 概率掉 1 或 2 颗
    const dropCount = plant.def.dandelion ? 1 : (Math.random() < 0.5 ? 1 : 2);
    for(let i=0; i<dropCount; i++){
      const defId = rollDropDefId(plant.def);
      const dx = plant.bed.cx + rand(-14, 14);
      const dy = plant.bed.cy - 30 - i * 8;
      STATE.groundSeeds.push({
        defId,
        x: dx,
        y: dy,
        vx: rand(-30, 30),
        vy: rand(-90, -50),
        t: 0,
      });
    }
    // Round 4：特殊花朵特性掉落（蒲公英/樱花/睡莲/向日葵/薰衣草/红葵/仙人掌）
    harvestSpecialBonus(plant, fx, fy);
  }
  // 蒲公英：直接完成
  if(plant.def.dandelion){
    plant.flowerSpent = true;
    plant.dead = true;
    setTimeout(() => { plant.bed.occupied = false; }, 500);
    showHint(`蒲公英飞散！+${reward}💰`);
    return;
  }
  // 3 次后枯萎
  if(plant.harvests >= 3){
    plant.dead = true;
    plant.flowerSpent = true;
    // Round 4：终末礼物 — 额外 1 颗最稀有花种子
    harvestFinalBonus(plant, fx, fy);
    setTimeout(() => { plant.bed.occupied = false; }, 800);
    showHint(`收获完啦！+${reward*3}💰 总计`);
  } else {
    showHint(`采了 1 次！还剩 ${3-plant.harvests} 次 +${reward}💰`);
  }
}

/* ============================================================
 *  生长 / 死亡
 * ============================================================ */
function updatePlants(dt){
  for(const p of STATE.plants){
    if(p.dead){
      // 缩小消失
      p._dieT = (p._dieT || 0) + dt;
      if(p._dieT > 1.5){
        p.bed.occupied = false;
        p.bed.plantId = -1;
        p._removed = true;
      }
      continue;
    }
    // 失水倒计时
    p.waterTimer += dt;
    if(p.waterTimer > 180){
      p.dead = true;
      p._dieT = 0;
      showHint('太渴了…枯萎了');
      continue;
    }
    // 生长速度 = max(0, 水量) × 基础速度
    const nightMul = isNight() ? STATE.nightSlow : 1.0;
    const moist = clamp(p.moisture, 0, 1);
    const baseRate = 1.0 / (p.def.growMs / 1000); // 每秒进度
    // Round 6：季节加成 —— 非当季花生长速度 ×0.5
    const seasonMul = seasonCanBloom(p.def) ? 1.0 : 0.5;
    p.age += baseRate * nightMul * moist * seasonMul * dt;
    // 水量随时间下降
    p.moisture = Math.max(0, p.moisture - dt * 0.05);
    p.bed.moisture = Math.max(0, p.bed.moisture - dt * 0.04);
    // 开花检测
    if(p.age >= 0.75 && !p.hasBloomed){
      p.hasBloomed = true;
      playBloom();
      spawnPollenBurst(p.bed.cx, p.bed.cy - 40, p.def.flowerColor);
    }
  }
  STATE.plants = STATE.plants.filter(p => !p._removed);
}

/* ============================================================
 *  蝴蝶
 * ============================================================ */
function updateButterflies(dt){
  for(const p of STATE.plants){
    if(p.hasBloomed && !p.flowerSpent && !p.dead && p.pollCount < 3){
      // 需要蝴蝶
      const have = STATE.butterflies.some(b => b.plantId === p.id);
      if(!have && Math.random() < dt * 1.2){
      spawnButterfly(p);
    } else if(STATE.butterflies.filter(b => b.plantId === p.id).length === 1 && Math.random() < dt * 0.6){
      spawnButterfly(p);
    }
      }
  }
  for(const b of STATE.butterflies){
    b.t = (b.t || 0) + dt;
    // 贝塞尔曲线飞行
    const cx = b.plant.bed.cx + Math.sin(b.t * 1.2 + b.ph) * 80;
    const cy = b.plant.bed.cy - 50 + Math.cos(b.t * 0.9 + b.ph) * 40;
    b.x = lerp(b.x, cx, 0.05);
    b.y = lerp(b.y, cy, 0.05);
    // 偶尔停花
    if(!b.restT) b.restT = rand(1.5, 3);
    b.restT -= dt;
    if(b.restT <= 0 && !b.pollen && Math.random() < dt * 1.5){
      b.rest = true;
      b.restStart = b.t;
      b.pollen = true;
    }
    if(b.rest && b.t - b.restStart > 1.2){
      // 授粉完成
      const pl = b.plant;
      pl.pollCount += 1;
      spawnPollenBurst(pl.bed.cx, pl.bed.cy - 40, pl.def.flowerColor);
      b.rest = false;
      b.pollen = false;
      b.restT = rand(1.5, 3);
      if(pl.pollCount >= 3){
        // 花变棕 → 蒲公英飞散 / 其他留种
        pl.flowerSpent = true;
        playSeedPop();
        if(pl.def.dandelion){
          releaseDandelion(pl);
        } else {
          releaseSeedFromFlower(pl);
        }
      }
    }
  }
  STATE.butterflies = STATE.butterflies.filter(b => !(b.plant.flowerSpent || b.plant.dead));
}

function spawnButterfly(plant){
  STATE.butterflies.push({
    plantId: plant.id,
    plant,
    x: plant.bed.cx + rand(-30,30),
    y: plant.bed.cy - 60 + rand(-20,20),
    ph: Math.random() * TAU,
    t: 0,
    restT: rand(2, 6),
    rest: false, pollen: false,
  });
}

function releaseDandelion(plant){
  // 蒲公英：飞散 8 个种子
  for(let i=0;i<10;i++){
    STATE.flyingSeeds.push({
      defId: plant.def.id,
      x: plant.bed.cx,
      y: plant.bed.cy - 40,
      vx: rand(-1, 1) * 60,
      vy: rand(-2, -0.5) * 30,
      t: 0,
    });
  }
  plant.dead = true; plant._dieT = 0;
}

function releaseSeedFromFlower(plant){
  // 非蒲公英：留 1 个种子
  STATE.flyingSeeds.push({
    defId: plant.def.id,
    x: plant.bed.cx + rand(-10,10),
    y: plant.bed.cy - 30,
    vx: rand(-30, 30), vy: -40,
    t: 0,
  });
  plant.flowerSpent = false; // 仍保留在场景
  plant.dead = true; plant._dieT = 0;
}

function updateFlyingSeeds(dt){
  for(const s of STATE.flyingSeeds){
    s.t += dt;
    s.vy += 20 * dt; // 重力
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.99;
    if(s.y > H + 50) s._gone = true;
  }
  STATE.flyingSeeds = STATE.flyingSeeds.filter(s => !s._gone);
}

// 地上掉落种子：重力下落 + 弹一下停在地面
function updateGroundSeeds(dt){
  const groundY = SCENE.groundY - 6;
  for(const s of STATE.groundSeeds){
    s.t += dt;
    s.vy += 320 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.92;
    if(s.y > groundY){
      s.y = groundY;
      if(Math.abs(s.vy) > 30){
        s.vy *= -0.45;
        s.vx *= 0.7;
      } else {
        s.vy = 0;
      }
    }
  }
}

/* ============================================================
 *  粒子
 * ============================================================ */
function spawnDrop(x,y){

/* Round 6：每季专属的环境粒子（春花粉飘 / 夏萤火虫飞 / 秋落叶飘 / 冬雪花落） */
function spawnAmbientParticle(s){
  if(s.ambientKind === 'pollen'){
    // 飘散花粉 — 从顶部附近生成缓慢下落
    STATE.particles.push({
      kind: 'pollen', x: rand(0, W), y: rand(-20, H * 0.5),
      vx: rand(-15, 15), vy: rand(8, 22),
      life: rand(4, 8), max: 8,
      r: rand(2, 3), color: s.ambientColor,
      ph: Math.random()*TAU,
    });
  } else if(s.ambientKind === 'firefly'){
    // 萤火虫 — 夜空中游离飘动
    STATE.particles.push({
      kind: 'firefly', x: rand(0, W), y: rand(H * 0.15, H * 0.65),
      vx: rand(-18, 18), vy: rand(-8, 8),
      life: rand(5, 9), max: 9,
      r: rand(2.5, 4), color: s.ambientColor,
      ph: Math.random()*TAU,
    });
  } else if(s.ambientKind === 'leaf'){
    // 落叶 — 顶部掉落 + 左右飘
    STATE.particles.push({
      kind: 'leaf', x: rand(-20, W + 20), y: -10,
      vx: rand(-25, 25), vy: rand(25, 55),
      life: rand(6, 11), max: 11,
      r: rand(4, 6), color: s.ambientColor,
      ph: Math.random()*TAU,
    });
  } else if(s.ambientKind === 'snow'){
    // 雪花 — 慢飘下落
    STATE.particles.push({
      kind: 'snow', x: rand(0, W), y: -10,
      vx: rand(-6, 6), vy: rand(18, 42),
      life: rand(8, 14), max: 14,
      r: rand(2, 4), color: s.ambientColor,
      ph: Math.random()*TAU,
    });
  }
}
function updateSeasonParticles(dt){
  // 每秒约 1.5 颗，根据亮度（夜晚少许）调密度
  const rate = isNight() ? 1.0 : 1.5;
  if(Math.random() < dt * rate){
    spawnAmbientParticle(currentSeason());
  }
}
function updateParticles(dt){
  for(const p of STATE.particles){
    p.life -= dt;
    if(p.kind === 'drop'){
      p.vy += 240 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    } else if(p.kind === 'pollen'){
      p.vy += 18 * dt;
      p.vx *= 0.99;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    } else if(p.kind === 'petal'){
      p.vy += p.g * dt;
      p.vx *= 0.98;
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.angle = (p.angle || 0) + p.vx * 0.02;
    } else if(p.kind === 'star'){
      // Round 5：星星粒子 — 受重力下落 + 缓慢旋转
      p.vy += 80 * dt;
      p.vx *= 0.98;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.ph += dt * 3;
    } else if(p.kind === 'firefly'){
      // Round 6：萤火虫 — 自由飘移 + 越界回环
      p.t = (p.t || 0) + dt;
      p.x += p.vx * dt + Math.sin(p.t * 1.5 + p.ph) * 14 * dt;
      p.y += p.vy * dt + Math.cos(p.t * 1.2 + p.ph * 0.7) * 6 * dt;
      if(p.x < -10) p.x = W + 10;
      if(p.x > W + 10) p.x = -10;
      if(p.y < H * 0.1) p.vy = Math.abs(p.vy);
      if(p.y > H * 0.7) p.vy = -Math.abs(p.vy);
    } else if(p.kind === 'leaf'){
      // Round 6：落叶 — 重力 + 左右飘 + 翻面角
      p.t = (p.t || 0) + dt;
      p.vy += 4 * dt;
      p.vx *= 0.99;
      p.x += p.vx * dt + Math.sin(p.t * 2 + p.ph) * 22 * dt;
      p.y += p.vy * dt;
      p.angle = (p.angle || 0) + p.vx * 0.04 + Math.sin(p.t*2) * 0.05;
      if(p.y > H + 20) p.life = 0;
    } else if(p.kind === 'snow'){
      // Round 6：雪花 — 慢飘 + 左右摆动
      p.t = (p.t || 0) + dt;
      p.vy += 2 * dt;
      p.vx *= 0.99;
      p.x += p.vx * dt + Math.sin(p.t * 1.5 + p.ph) * 10 * dt;
      p.y += p.vy * dt;
      if(p.y > H + 20) p.life = 0;
    }
  }
  STATE.particles = STATE.particles.filter(p => p.life > 0);
}

function updateFloats(dt){
  if(!STATE.floats) return;
  for(const f of STATE.floats){
    f.t += dt;
    f.y -= 30 * dt;  // 向上飘
  }
  STATE.floats = STATE.floats.filter(f => f.t < 1.5);
}

function drawFloats(){
  if(!STATE.floats) return;
  for(const f of STATE.floats){
    const alpha = clamp(1 - f.t / 1.5, 0, 1);
    X.save();
    X.globalAlpha = alpha;
    X.fillStyle = f.color;
    X.strokeStyle = '#fff';
    X.lineWidth = 3;
    X.font = 'bold 18px sans-serif';
    X.textAlign = 'center';
    X.textBaseline = 'middle';
    X.strokeText(f.text, f.x, f.y);
    X.fillText(f.text, f.x, f.y);
    X.restore();
  }
}

/* ============================================================
 *  Round 3：解锁成就 toast（顶部堆叠 + 淡入淡出）
 * ============================================================ */
function updateToasts(dt){
  if(!STATE.toasts) return;
  for(const t of STATE.toasts) t.t += dt;
  // 多保留 0.5s 给淡出动画
  STATE.toasts = STATE.toasts.filter(t => t.t < t.life + 0.5);
}
function drawToasts(){
  if(!STATE.toasts || !STATE.toasts.length) return;
  const w = 280, h = 48;
  const baseX = (W - w) / 2;
  const baseY = 36;
  const gap = 8;
  for(let i=0; i<STATE.toasts.length; i++){
    const t = STATE.toasts[i];
    const fadeIn = clamp(t.t / 0.3, 0, 1);
    const fadeOut = clamp((t.life - t.t) / 0.5, 0, 1);
    const alpha = Math.min(fadeIn, fadeOut);
    if(alpha <= 0) continue;
    // 顶部下滑入场 + 堆叠位移
    const slideIn = (1 - fadeIn) * -22;
    const x = baseX + Math.sin(t.t * 4 + i) * 1.2; // 轻微左右摇摆
    const y = baseY + i * (h + gap) + slideIn;
    X.save();
    X.globalAlpha = alpha;
    // 阴影
    X.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(x + 2, y + 4, w, h, 14);
    X.fill();
    // 卡片底色
    X.fillStyle = '#fff8e0';
    roundRect(x, y, w, h, 14);
    X.fill();
    // 彩色边框
    X.strokeStyle = t.color || '#e8a040';
    X.lineWidth = 3;
    X.stroke();
    // 星星图标
    X.font = '24px sans-serif';
    X.textAlign = 'left';
    X.textBaseline = 'middle';
    X.fillText(t.emoji, x + 14, y + h/2 + 1);
    // 标题
    X.fillStyle = '#5a3a1a';
    X.font = 'bold 12px sans-serif';
    X.fillText(t.title, x + 50, y + 14);
    // 种子名（带 emoji）
    X.fillStyle = '#7a4a20';
    X.font = 'bold 15px sans-serif';
    X.fillText(`${t.seedEmoji} ${t.name}`, x + 50, y + 33);
    X.restore();
  }
  X.textAlign = 'left';
  X.textBaseline = 'middle';
}

/* ============================================================
 *  昼夜
 * ============================================================ */
function isNight(){
  return STATE.dayTime > 0.78 || STATE.dayTime < 0.22;
}
function isDusk(){
  return STATE.dayTime > 0.72 && STATE.dayTime <= 0.78;
}
function updateDay(dt){
  const prev = STATE.dayTime;
  STATE.dayTime = (STATE.dayTime + dt / STATE.dayLen) % 1;
  // 跨过 1（wrap-around）→ 新的一天
  if(prev > STATE.dayTime){
    STATE.orderDay += 1;
    // Round 6：更新 dayInSeason + 检查季节切换
    const prevSeasonIdx = STATE.seasonIdx | 0;
    STATE.seasonIdx = Math.floor(STATE.orderDay / 5) % 4;
    STATE.dayInSeason = (STATE.orderDay % 5) + 1;
    if(prevSeasonIdx !== STATE.seasonIdx){
      // 季节切换！显示大字幕 banner（自动 3s 淡出）
      const s = SEASONS[STATE.seasonIdx];
      STATE.seasonBanner = {
        emoji: s.emoji,
        title: `${s.emoji} ${s.name}天来了！`,
        sub: '新的花朵和访客在等你…',
        t: 0, life: 3.0,
      };
      showHint(`${s.emoji} ${s.name}天来了！共有新花朵和访客～`, 3500);
    }
    generateOrders();
    showHint('新的一天！新订单来了～');
  }
}

function updateOrders(dt){
  for(const o of STATE.orders){
    if(o.done) continue;
    o.timeLeft -= dt;
    if(o.timeLeft <= 0){
      o.done = true;
      o.failed = true;
      o.timeLeft = 0;
      STATE.reputation = Math.max(0, STATE.reputation - 5);
      showHint(`${o.npc.name} 等不及走了… 声望 -5`);
    }
  }
}

/* ============================================================
 *  音效（WebAudio 合成）
 * ============================================================ */
let AC = null;
function initAudio(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
}
function playSplash(){
  if(!AC) return;
  const buf = AC.createBuffer(1, AC.sampleRate * 0.18, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const t = i / d.length;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.5) * 0.4;
  }
  const src = AC.createBufferSource();
  src.buffer = buf;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 1.5;
  const g = AC.createGain(); g.gain.value = 0.25;
  src.connect(bp).connect(g).connect(AC.destination);
  src.start();
}
function playBloom(){
  if(!AC) return;
  const t = AC.currentTime;
  [523.25, 659.25, 783.99].forEach((f,i) => {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + i*0.08);
    g.gain.linearRampToValueAtTime(0.18, t + i*0.08 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.08 + 0.5);
    o.connect(g).connect(AC.destination);
    o.start(t + i*0.08);
    o.stop(t + i*0.08 + 0.55);
  });
}
function playSeedPop(){
  if(!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(800, t);
  o.frequency.exponentialRampToValueAtTime(200, t + 0.3);
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + 0.35);
}

/* ============================================================
 *  渲染
 * ============================================================ */
function drawSky(){
  const g = X.createLinearGradient(0, 0, 0, SCENE.groundY);
  if(isNight()){
    g.addColorStop(0, '#1a2050');
    g.addColorStop(0.6, '#2a3070');
    g.addColorStop(1, '#5a4880');
  } else if(isDusk()){
    g.addColorStop(0, '#f0a060');
    g.addColorStop(0.5, '#f0c890');
    g.addColorStop(1, '#f8e0b0');
  } else {
    // Round 6：日间天空跟随季节调整主色
    const s = currentSeason().skyDay;
    g.addColorStop(0, s[0]);
    g.addColorStop(0.6, s[1]);
    g.addColorStop(1, s[2]);
  }
  X.fillStyle = g;
  X.fillRect(0, 0, W, SCENE.groundY);
}

function drawCloud(){
  // 简单的云：3 圆
  X.fillStyle = isNight() ? 'rgba(220,220,240,0.7)' : 'rgba(255,255,255,0.85)';
  const cx = W * 0.3 + Math.sin(STATE.time * 0.05) * 20;
  const cy = H * 0.12;
  X.beginPath();
  X.arc(cx, cy, 26, 0, TAU);
  X.arc(cx + 22, cy + 6, 30, 0, TAU);
  X.arc(cx + 48, cy, 22, 0, TAU);
  X.arc(cx + 22, cy - 8, 22, 0, TAU);
  X.fill();
}

function drawSunMoon(){
  const r = SCENE.sun.r;
  // Round 6：太阳/月亮颜色随季节微调
  const s = currentSeason();
  if(isNight()){
    // 月亮
    X.fillStyle = s.moonTint;
    X.beginPath(); X.arc(SCENE.sun.x, SCENE.sun.y, r, 0, TAU); X.fill();
    X.fillStyle = '#d8d0a8';
    X.beginPath(); X.arc(SCENE.sun.x - r*0.3, SCENE.sun.y - r*0.2, r*0.18, 0, TAU); X.fill();
    X.beginPath(); X.arc(SCENE.sun.x + r*0.3, SCENE.sun.y + r*0.1, r*0.12, 0, TAU); X.fill();
    // 星星
    X.fillStyle = '#fff8d0';
    for(let i=0;i<10;i++){
      const sx = (W * 0.1 + i * 60 + Math.sin(i*3.7)*10) % W;
      const sy = (H * 0.06 + Math.cos(i*2.3) * 20);
      const tw = 0.6 + 0.4 * Math.sin(STATE.time * 3 + i);
      X.globalAlpha = tw;
      X.fillRect(sx, sy, 2, 2);
    }
    X.globalAlpha = 1;
  } else {
    // 太阳 + 光晕（光晕色随季节）
    const grd = X.createRadialGradient(SCENE.sun.x, SCENE.sun.y, r*0.5, SCENE.sun.x, SCENE.sun.y, r*2);
    // Sun-core tint
    const sunHex = s.sunTint;
    // 简单粗略 RGB（A=255，R/G/B 提取）
    const m = sunHex.match(/^#([0-9a-f]{6})$/i);
    const rr = m ? parseInt(m[1].slice(0,2),16) : 255;
    const gg = m ? parseInt(m[1].slice(2,4),16) : 240;
    const bb = m ? parseInt(m[1].slice(4,6),16) : 160;
    grd.addColorStop(0, `rgba(${rr},${gg},${bb},0.7)`);
    grd.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
    X.fillStyle = grd;
    X.beginPath(); X.arc(SCENE.sun.x, SCENE.sun.y, r*2, 0, TAU); X.fill();
    X.fillStyle = sunHex;
    X.beginPath(); X.arc(SCENE.sun.x, SCENE.sun.y, r, 0, TAU); X.fill();
    // 笑脸
    X.fillStyle = '#c87020';
    X.beginPath(); X.arc(SCENE.sun.x - r*0.3, SCENE.sun.y - r*0.15, r*0.08, 0, TAU); X.fill();
    X.beginPath(); X.arc(SCENE.sun.x + r*0.3, SCENE.sun.y - r*0.15, r*0.08, 0, TAU); X.fill();
    X.strokeStyle = '#c87020';
    X.lineWidth = Math.max(2, r*0.08);
    X.beginPath();
    X.arc(SCENE.sun.x, SCENE.sun.y + r*0.1, r*0.35, 0.2*Math.PI, 0.8*Math.PI);
    X.stroke();
  }
}

function drawGround(){
  // 草地：跟随季节调整主色（春绿/夏金/秋橙/冬雪）
  const s = currentSeason();
  const gg = X.createLinearGradient(0, SCENE.groundY, 0, H);
  gg.addColorStop(0, s.ground[0]);
  gg.addColorStop(1, s.ground[1]);
  X.fillStyle = gg;
  X.fillRect(0, SCENE.groundY, W, H - SCENE.groundY);
  // 草地纹理：小草（颜色按季节微调）
  // 冬白/夏金 → 用稍深一档的同色系；春秋用 #5a9038
  const seasonIdx = STATE.seasonIdx | 0;
  X.strokeStyle = seasonIdx === 3 ? '#b0b8c8' : (seasonIdx === 1 ? '#a09040' : (seasonIdx === 2 ? '#a06040' : '#5a9038'));
  X.lineWidth = 1.5;
  for(let i=0;i<60;i++){
    const gx = (i * 47 + 13) % W;
    const gy = SCENE.groundY + ((i * 31) % (H - SCENE.groundY - 5));
    X.beginPath();
    X.moveTo(gx, gy);
    X.lineTo(gx + Math.sin(i)*2, gy - 6);
    X.stroke();
  }
}

function drawBeds(){
  for(const b of SCENE.beds){
    // 土堆（土棕椭圆）
    const moist = b.moisture;
    const baseR = 90, baseG = 60, baseB = 30;
    const dr = baseR - moist * 18;
    const dg = baseG - moist * 14;
    const db = baseB - moist * 8;
    X.fillStyle = `rgb(${dr|0},${dg|0},${db|0})`;
    X.beginPath();
    X.ellipse(b.cx, b.cy + 12, b.w*0.55, 18, 0, 0, TAU);
    X.fill();
    // 阴影
    X.fillStyle = 'rgba(0,0,0,0.15)';
    X.beginPath();
    X.ellipse(b.cx, b.cy + 22, b.w*0.5, 6, 0, 0, TAU);
    X.fill();
    // 高亮光环（空位提示）
    if(!b.occupied){
      X.strokeStyle = 'rgba(255,255,255,0.4)';
      X.lineWidth = 2;
      X.setLineDash([4,4]);
      X.beginPath();
      X.ellipse(b.cx, b.cy + 12, b.w*0.5, 14, 0, 0, TAU);
      X.stroke();
      X.setLineDash([]);
    }
  }
}

function drawPlants(){
  for(const p of STATE.plants){
    const x = p.bed.cx, baseY = p.bed.cy + 4;
    const sway = Math.sin(STATE.time * 1.5 + p.phase) * 0.015;
    if(p.dead){
      // 枯萎棕色缩
      const s = clamp(1 - p._dieT / 1.5, 0, 1);
      X.save();
      X.translate(x, baseY);
      X.scale(s, s);
      X.fillStyle = '#6a4a20';
      X.beginPath();
      X.moveTo(0, 0); X.lineTo(-2*sway*100, -20); X.lineTo(2*sway*100, -20);
      X.closePath(); X.fill();
      X.restore();
      continue;
    }
    const age = p.age;
    X.save();
    X.translate(x, baseY);
    X.rotate(sway);
    // 阶段 1: 种子期（0-25%）显示半截种子
    if(age < 0.25){
      const k = age / 0.25;
      X.fillStyle = p.def.seedColor;
      X.beginPath();
      X.ellipse(0, 2 - k*4, 5, 4 + k*2, 0, 0, TAU);
      X.fill();
    }
    // 阶段 2: 发芽（25-50%）
    if(age >= 0.20){
      const stemH = lerp(0, 22, clamp((age - 0.20) / 0.30, 0, 1));
      X.strokeStyle = '#5ac050';
      X.lineWidth = 3;
      X.lineCap = 'round';
      X.beginPath();
      X.moveTo(0, 0);
      X.lineTo(0, -stemH);
      X.stroke();
      // 嫩芽叶
      if(age >= 0.30){
        const lk = clamp((age - 0.30) / 0.20, 0, 1);
        X.fillStyle = '#7ad060';
        X.beginPath();
        X.ellipse(-4, -stemH + 2, 4*lk, 3*lk, -0.5, 0, TAU);
        X.fill();
        X.beginPath();
        X.ellipse(4, -stemH + 6, 4*lk, 3*lk, 0.5, 0, TAU);
        X.fill();
      }
    }
    // 阶段 3: 长叶期（50-75%）
    if(age >= 0.45){
      const stemH = lerp(22, 60, clamp((age - 0.45) / 0.30, 0, 1));
      X.strokeStyle = '#3a9030';
      X.lineWidth = 4;
      X.beginPath();
      X.moveTo(0, 0);
      X.lineTo(0, -stemH);
      X.stroke();
      // 叶片
      const lk = clamp((age - 0.45) / 0.15, 0, 1);
      X.fillStyle = '#5ac050';
      X.beginPath(); X.ellipse(-10, -stemH*0.5, 9*lk, 5*lk, -0.4, 0, TAU); X.fill();
      X.beginPath(); X.ellipse( 10, -stemH*0.7, 9*lk, 5*lk,  0.4, 0, TAU); X.fill();
    }
    // 阶段 4: 开花（>=75%）
    if(age >= 0.75){
      const stemH = 60;
      const fk = clamp((age - 0.75) / 0.20, 0, 1);
      const hs = p.harvestScale || 1;
      drawFlower(0, -stemH, p.def, fk * hs, p.pollCount);
    }
    X.restore();
  }
}

function drawFlower(x, y, def, k, pollCount){
  X.save();
  X.translate(x, y);
  if(def.id === 'sun'){
    // 向日葵：大黄盘
    const r = 18 * k;
    for(let i=0;i<12;i++){
      const a = i / 12 * TAU;
      X.fillStyle = i % 2 === 0 ? '#ffd040' : '#ffb820';
      X.beginPath();
      X.ellipse(Math.cos(a)*r*0.9, Math.sin(a)*r*0.9, 6*k, 10*k, a, 0, TAU);
      X.fill();
    }
    X.fillStyle = def.flowerCore;
    X.beginPath(); X.arc(0, 0, 9*k, 0, TAU); X.fill();
    // 笑脸
    if(pollCount > 0){
      X.fillStyle = '#fff';
      X.beginPath(); X.arc(-3*k, -2*k, 1.5*k, 0, TAU); X.fill();
      X.beginPath(); X.arc( 3*k, -2*k, 1.5*k, 0, TAU); X.fill();
    }
  } else if(def.id === 'rose'){
    // 玫瑰：螺旋
    const r = 14 * k;
    for(let layer=3; layer>=0; layer--){
      const lr = r * (1 - layer*0.2);
      X.fillStyle = `hsl(345,${70-layer*8}%,${55-layer*8}%)`;
      X.beginPath();
      for(let i=0;i<6;i++){
        const a = i/6 * TAU + layer*0.3;
        X.ellipse(Math.cos(a)*lr*0.5, Math.sin(a)*lr*0.5, lr*0.6, lr*0.4, a, 0, TAU);
      }
      X.fill();
    }
    X.fillStyle = '#a02040';
    X.beginPath(); X.arc(0,0, 4*k, 0, TAU); X.fill();
  } else if(def.id === 'daisy'){
    // 雏菊：白瓣 + 黄心
    const r = 14 * k;
    for(let i=0;i<10;i++){
      const a = i/10 * TAU;
      X.fillStyle = '#ffffff';
      X.strokeStyle = '#e0d8b8';
      X.lineWidth = 1;
      X.beginPath();
      X.ellipse(Math.cos(a)*r*0.85, Math.sin(a)*r*0.85, 4*k, 7*k, a, 0, TAU);
      X.fill(); X.stroke();
    }
    X.fillStyle = '#f0c040';
    X.beginPath(); X.arc(0,0, 5*k, 0, TAU); X.fill();
  } else if(def.id === 'tulip'){
    // 郁金香：紫色杯
    const r = 12 * k;
    X.fillStyle = '#9050d0';
    // 三个瓣
    X.beginPath();
    X.moveTo(-r, 0);
    X.quadraticCurveTo(-r*1.1, -r*0.8, 0, -r*1.4);
    X.quadraticCurveTo(r*1.1, -r*0.8, r, 0);
    X.quadraticCurveTo(0, r*0.3, -r, 0);
    X.fill();
    X.fillStyle = '#7028b0';
    X.beginPath();
    X.ellipse(-r*0.4, -r*0.5, r*0.5, r*1.2, -0.3, 0, TAU);
    X.fill();
    X.beginPath();
    X.ellipse(r*0.4, -r*0.5, r*0.5, r*1.2, 0.3, 0, TAU);
    X.fill();
  } else if(def.id === 'dand'){
    // 蒲公英：黄色绒球
    if(!def._spent){
      const r = 14 * k;
      // 多根黄线条
      X.strokeStyle = def.flowerColor;
      X.lineWidth = 1.5;
      for(let i=0;i<18;i++){
        const a = i/18 * TAU;
        X.beginPath();
        X.moveTo(0, 0);
        X.lineTo(Math.cos(a)*r, Math.sin(a)*r);
        X.stroke();
      }
      X.fillStyle = def.flowerCore;
      X.beginPath(); X.arc(0,0, r*0.4, 0, TAU); X.fill();
    }
  }
  // 枯萎
  if(pollCount >= 3){
    X.fillStyle = 'rgba(80,50,20,0.5)';
    X.beginPath(); X.arc(0,0, 16, 0, TAU); X.fill();
  }
  X.restore();
}

function drawButterflies(){
  for(const b of STATE.butterflies){
    const x = b.x, y = b.y;
    const flap = Math.sin(b.t * 12) * 0.6 + 0.4; // 翅膀扇动
    // 阴影

    X.fill();
    // 翅膀
    X.fillStyle = '#ffa040';
    X.save();
    X.translate(x, y);
    // 左翅
    X.save();
    X.scale(-flap, 1);
    X.beginPath();
    X.ellipse(-4, -2, 6, 9, -0.3, 0, TAU);
    X.fill();
    X.fillStyle = '#5a2a80';
    X.beginPath();
    X.ellipse(-4, 1, 3, 4, -0.3, 0, TAU);
    X.fill();
    X.restore();
    // 右翅
    X.fillStyle = '#ffa040';
    X.save();
    X.scale(flap, 1);
    X.beginPath();
    X.ellipse(4, -2, 6, 9, 0.3, 0, TAU);
    X.fill();
    X.fillStyle = '#5a2a80';
    X.beginPath();
    X.ellipse(4, 1, 3, 4, 0.3, 0, TAU);
    X.fill();
    X.restore();
    // 身体
    X.fillStyle = '#3a1a40';
    X.beginPath();
    X.ellipse(0, 0, 1.5, 5, 0, 0, TAU);
    X.fill();

    X.strokeStyle = '#3a1a40';
    X.lineWidth = 1;

    X.moveTo(-1, -4); X.lineTo(-3, -8);
