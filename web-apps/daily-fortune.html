<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>每日运势</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:"Songti SC",serif;color:#e0d8c8}
.card{width:450px;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:40px;backdrop-filter:blur(10px);transition:transform .15s}
.card.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 rgba(201,168,76,0)}50%{box-shadow:0 0 40px rgba(201,168,76,.8)}100%{box-shadow:0 0 0 rgba(201,168,76,0)}}
.fade-in{animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h1{text-align:center;color:#c9a84c;font-size:24px;letter-spacing:3px;margin-bottom:5px}
.date{text-align:center;color:#888;font-size:14px;margin-bottom:30px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px}
.grade-box{background:rgba(15,52,96,.5);padding:15px;border-radius:10px;text-align:center}
.grade-box .label{font-size:13px;color:#888;margin-bottom:5px}
.grade-box .value{font-size:22px;font-weight:bold}
.great{color:#ffd700}
.good{color:#4ecdc4}
.mid{color:#e0d8c8}
.bad{color:#e94560}
.lucky{text-align:center;padding:20px;background:rgba(201,168,76,.1);border-radius:10px;margin-bottom:25px;line-height:2}
.lucky span{color:#c9a84c;font-weight:bold}
.yl{display:flex;gap:20px;margin-bottom:25px}
.yl>div{flex:1;padding:15px;border-radius:10px}
.yi{background:rgba(78,205,196,.15);border:1px solid #4ecdc4}
.ji{background:rgba(233,69,96,.15);border:1px solid #e94560}
.yl h4{margin-bottom:10px;font-size:14px}
.yl ul{list-style:none;font-size:13px;line-height:2}
.summary{text-align:center;padding:20px;background:rgba(255,255,255,.05);border-radius:10px;font-size:15px;line-height:1.8}
button{display:block;margin:25px auto 0;background:#c9a84c;color:#1a1a2e;border:none;padding:12px 40px;border-radius:25px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:bold}
button:hover{background:#ffd700}
</style>
</head>
<body>
<div class="card">
<h1>每 日 运 势</h1>
<div class="date" id="date"></div>
<div class="grades" id="grades"></div>
<div class="lucky" id="lucky"></div>
<div class="yl">
<div class="yi"><h4>✅ 今日宜</h4><ul id="yi"></ul></div>
<div class="ji"><h4>❌ 今日忌</h4><ul id="ji"></ul></div>
</div>
<div class="summary" id="summary"></div>
<button onclick="gen()">🔄 换一换</button>
</div>

<script>
const DO=["谈合作","见客户","签合同","吃火锅","早睡早起","给父母打电话","整理桌面","运动30分钟","学习新东西","喝8杯水","买一张彩票","夸身边人","写日记","冥想10分钟","拒绝无效社交"];
const DONT=["冲动消费","熬夜","跟人吵架","随便借钱","吃垃圾食品","拖延重要工作","刷短视频超1小时","发朋友圈发牢骚","吃生冷食物","轻信陌生人","气头上做决定","忘记喝水","久坐不动","胡思乱想"];
const COLORS=["朱红","靛蓝","明黄","墨黑","月白","青绿","橙红","灰紫","檀棕","藕粉"];
const DIRS=["正东","正南","正西","正北","东南","东北","西南","西北"];
const GRADES=["大吉","中吉","小吉","平","小凶","中凶"];

function cls(g){return g.includes("大吉")?"great":g.includes("吉")?"good":g==="平"?"mid":"bad"}

let nonce=0;
function gen(){
nonce++;
const today=new Date().toLocaleDateString("zh-CN");
document.getElementById("date").textContent=today;
const seed=[...today].reduce((a,c)=>a+c.charCodeAt(0),0)+nonce*7919;
let rng=mulberry32(seed);
function pick(arr){return arr[Math.floor(rng()*arr.length)]}
function sample(arr,n){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}

const work=pick(GRADES),money=pick(GRADES),love=pick(GRADES),health=pick(GRADES);
document.getElementById("grades").innerHTML=`
<div class="grade-box"><div class="label">事业运</div><div class="value ${cls(work)}">${work}</div></div>
<div class="grade-box"><div class="label">财运</div><div class="value ${cls(money)}">${money}</div></div>
<div class="grade-box"><div class="label">感情运</div><div class="value ${cls(love)}">${love}</div></div>
<div class="grade-box"><div class="label">健康运</div><div class="value ${cls(health)}">${health}</div></div>`;

document.getElementById("lucky").innerHTML=`幸运色: <span>${pick(COLORS)}</span> | 幸运数字: <span>${1+Math.floor(rng()*9)}</span> | 幸运方位: <span>${pick(DIRS)}</span>`;

const yi=sample(DO,3),ji=sample(DONT,3);
document.getElementById("yi").innerHTML=yi.map(x=>`<li>${x}</li>`).join("");
document.getElementById("ji").innerHTML=ji.map(x=>`<li>${x}</li>`).join("");

const all=[work,money,love,health];const good=all.filter(g=>g.includes("吉")).length;
document.getElementById("summary").textContent=good>=3?"今日诸事顺遂，宜主动出击，把握机会。":good>=2?"今日平稳中带小喜，按部就班即可。":good>=1?"今日宜守不宜攻，稳扎稳打为上。":"今日诸事不宜大事，低调蛰伏，蓄力待发。";

// 闪光反馈
const card=document.querySelector(".card");
card.classList.remove("flash","fade-in");
void card.offsetWidth; // 触发重排
card.classList.add("flash","fade-in");
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

gen();
</script>
</body>
</html>
